<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mindstorm — Markdown Mindmaps</title>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--panel:#111722;--panel2:#171f2c;--line:#263144;--text:#ecf1fa;--muted:#8898b0;--accent:#9b8cff;--accent2:#62d5c7;--warn:#eac17a;--danger:#f07587;--radius:13px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100dvh}.sidebar{background:#101520;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{padding:24px 21px 25px;display:flex;gap:11px;align-items:center}.mark{width:35px;height:35px;background:linear-gradient(145deg,#a69aff,#5c72dc);border-radius:11px;display:grid;place-items:center;font-size:23px;color:white;box-shadow:0 7px 25px #7466dc33}.brand strong{font-size:21px;font-weight:750;letter-spacing:-.9px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.6px}.side-section{padding:0 13px}.side-head{display:flex;align-items:center;justify-content:space-between;margin:7px 8px 10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.iconbtn{background:transparent;border-radius:8px;padding:4px 9px;color:var(--muted);font-size:19px}.iconbtn:hover,.navitem:hover{background:#222b3b;color:var(--text)}.navlist{display:flex;flex-direction:column;gap:3px}.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;width:100%;text-align:left;border-radius:9px;color:#aab6c8;background:transparent;min-width:0}.navitem.active{background:#26233e;color:#d3cdff}.navitem span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.navitem .sym{font-size:16px;opacity:.9}.projectlabel{background:#141b29;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:0 7px 18px;font-weight:650;display:flex;gap:8px;align-items:center;justify-content:space-between}.projectlabel select{width:100%;min-width:0;background:transparent;color:var(--text);border:0;outline-offset:4px;font-weight:650;cursor:pointer}.projectlabel select option{background:#141b29;color:var(--text)}.side-footer{margin-top:auto;border-top:1px solid var(--line);padding:15px 12px;display:grid;gap:7px}.side-footer button{border:1px solid var(--line);background:#171e2b;border-radius:9px;padding:10px;text-align:left;color:#c8d2e2}.side-footer button:hover{border-color:#766cc4}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:73px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 26px;gap:12px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:800}.topbar h1{font-size:19px;margin:2px 0 0;letter-spacing:-.35px}.top-actions{display:flex;gap:8px;align-items:center}.btn{padding:9px 13px;background:#202a3a;border:1px solid #334056;border-radius:9px;font-weight:650;font-size:12px}.btn:hover{background:#2b364b}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111222}.btn.primary:hover{background:#b5aaff}.tabsbar{display:flex;gap:8px;padding:18px 26px 0;align-items:center;justify-content:space-between}.tabs{display:flex;padding:4px;background:#171d29;border:1px solid #242d40;border-radius:11px;gap:3px}.tab{padding:8px 15px;background:none;border-radius:8px;color:var(--muted);font-weight:650;font-size:12px}.tab.active{background:#34304f;color:#eeeaff}.hint{font-size:12px;color:var(--muted)}.workspace{min-height:0;flex:1;padding:17px 26px 22px;display:flex;flex-direction:column}.surface{flex:1;min-height:0;background:radial-gradient(ellipse at 60% 40%,#141b2a 0%,#111723 58%,#101520 100%);border:1px solid var(--line);border-radius:15px;overflow:hidden;position:relative}.surfacehead{position:absolute;z-index:2;top:17px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.surfacehead>*{pointer-events:auto}.subtle{color:var(--muted);font-size:12px}.pill{padding:6px 11px;border:1px solid #38445b;background:#1c2535;border-radius:30px;color:#bdc8da;font-size:11px}.mindcanvas{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:75px 30px 60px}.mindtree{min-width:max-content;display:flex;align-items:center;gap:55px}.treecol{display:flex;flex-direction:column;gap:21px;align-items:flex-start;position:relative}.treebranch{display:flex;align-items:center;gap:39px;position:relative}.treeroot{background:#544b91!important;border-color:#887bd8!important;color:white!important;padding:18px 23px!important;font-size:17px!important}.node{position:relative;text-align:left;display:flex;align-items:center;gap:10px;background:#202b3a;border:1px solid #3c4c61;border-radius:11px;padding:12px 15px;color:#f2f4ff;min-width:130px;max-width:280px;box-shadow:0 10px 25px #0002;white-space:normal}.node:hover{border-color:#a69aff;transform:translateY(-1px)}.node.selected{border-color:#b5aaff;box-shadow:0 0 0 2px #a99aff36}.node .dot{width:8px;height:8px;background:#9d90ff;border-radius:50%;flex:none}.node .nodeinner{min-width:0;display:flex;flex-direction:column;gap:5px}.node .nodetitle{font-size:13px;font-weight:650;overflow-wrap:anywhere}.node .nodefoot{display:flex;gap:7px;align-items:center;font-size:10px;color:#a2b1c6}.bar{height:4px;min-width:55px;width:85px;border-radius:8px;overflow:hidden;background:#364154}.bar>i{display:block;height:100%;background:#7dd5c4}.children{display:flex;flex-direction:column;gap:12px;border-left:1px solid #4a536c;padding-left:24px;position:relative}.children>.treebranch:before{content:"";position:absolute;width:24px;height:1px;background:#4a536c;left:-24px;top:50%}.treebranch:has(>.children)>.node:after{content:"";position:absolute;width:39px;height:1px;background:#4a536c;right:-40px;top:50%}.empty{text-align:center;color:var(--muted);padding:80px 20px}.kanban{display:flex;gap:14px;overflow:auto;height:100%;padding:72px 18px 22px}.lane{flex:1;min-width:178px;max-width:350px;background:#19212f;border:1px solid #283447;border-radius:11px;display:flex;flex-direction:column;padding:12px;gap:10px}.laneheading{display:flex;justify-content:space-between;align-items:center;padding:3px 2px 7px;letter-spacing:.2px;font-size:12px;font-weight:750}.count{background:#2b3648;color:#abb9ce;border-radius:20px;padding:1px 8px;font-size:11px}.ticket{background:#252f3f;border:1px solid #354358;border-radius:9px;padding:12px;display:grid;gap:9px;cursor:pointer}.ticket:hover{border-color:#8d84dc}.ticket b{font-size:12px}.ticket small{color:var(--muted)}.ticket select{width:100%;background:#1a2331;border:1px solid #41506a;border-radius:7px;color:var(--text);padding:6px;font-size:11px}.scope{background:#202a3a;color:var(--text);border:1px solid #3b4860;border-radius:7px;padding:7px 10px;max-width:230px}.editor{display:flex;flex-direction:column;height:100%;padding:70px 18px 18px;gap:10px}.editor textarea{width:100%;flex:1;resize:none;border:1px solid #303b50;background:#0d131d;color:#dce6f6;border-radius:9px;padding:21px;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.editfoot{display:flex;align-items:center;justify-content:space-between}.editfoot small{color:var(--muted)}.modalback{position:fixed;z-index:20;inset:0;background:#03060acb;display:grid;place-items:center;padding:18px}.modal{width:min(540px,100%);max-height:88dvh;overflow-y:auto;background:#1a2230;border:1px solid #38465b;border-radius:17px;padding:24px;box-shadow:0 24px 90px #0009}.modal h2{margin:0 0 6px;font-size:19px}.modal p{margin:0 0 18px;color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;font-weight:700;color:#abb9ce}.field input,.field textarea,.field select{width:100%;background:#101724;color:var(--text);border:1px solid #39485e;border-radius:8px;padding:10px}.field textarea{resize:vertical;min-height:105px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:20px;right:20px;z-index:40;background:#2b354a;border:1px solid #5a6580;padding:11px 17px;border-radius:10px;box-shadow:0 12px 50px #0007}.hidden{display:none!important}@media(max-width:850px){.app{grid-template-columns:67px 1fr}.brand{padding:20px 15px}.brand strong,.brand small,.side-head,.projectlabel,.navitem span:last-child,.side-footer button{display:none}.side-section{padding:0 7px}.navitem{justify-content:center}.navitem .sym{font-size:21px}.side-footer{min-height:72px}.topbar{padding:0 14px}.tabsbar{padding:12px 12px 0}.workspace{padding:12px}.hint{display:none}.top-actions .btn{padding:8px}.mindcanvas{justify-content:flex-start}.lane{min-width:175px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">✺</div><div><strong>mindstorm</strong><small>THINK IN STRUCTURES</small></div></div><div class="side-section"><div class="side-head"><span>PROJEKTE</span><button class="iconbtn" id="addProject" title="Projekt hinzufügen">+</button></div><div class="projectlabel" id="projectLabel"><select id="projectSelect" aria-label="Projekt auswählen"><option>Kein Projekt</option></select></div><div class="side-head"><span>DOKUMENTE</span><button class="iconbtn" id="addDocument" title="Dokument hinzufügen">+</button></div><div class="navlist" id="docList"></div></div><div class="side-footer"><button id="exportZip">⇩ &nbsp; Projekt exportieren</button><button id="importZip">⇧ &nbsp; ZIP importieren</button><input id="fileImport" type="file" accept=".zip,application/zip" class="hidden"></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="breadcrumb">WORKSPACE / PROJEKT</div><h1 id="docTitle">Übersicht</h1></div><div class="top-actions"><button class="btn" id="renameDoc">Umbenennen</button><button class="btn primary" id="newNode">+ Knoten</button></div></header><div class="tabsbar"><div class="tabs"><button class="tab active" data-view="mindmap">✳ &nbsp; Mindmap</button><button class="tab" data-view="kanban">▥ &nbsp; Kanban</button><button class="tab" data-view="markdown">⌘ &nbsp; Markdown</button></div><div class="hint" id="topHint">Knoten auswählen, um Details zu bearbeiten</div></div><div class="workspace"><section class="surface" id="surface"></section></div></main>
</div><div class="modalback hidden" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS=['story','todo','doing','review','done'];const STATUS_LABEL={story:'Story',todo:'To Do',doing:'In Progress',review:'Review',done:'Done'};
const SAMPLE=`# [ ] Mein Projekt\nEine zentrale Mindmap für Ideen, Aufgaben und Fortschritt.\n\n## [status:done] Planung\nDie Anforderungen und das Konzept werden vorbereitet.\n\n- [x] Ziele definieren\n- [x] Anforderungen sammeln\n\n## [status:doing] Entwicklung\nDie App wird Schritt für Schritt umgesetzt.\n\n- [x] Markdown-Parser\n- [ ] [status:doing] Mindmap-Ansicht\n- [ ] [status:todo] Kanban-Ansicht\n- [ ] [status:review] Dokumentation\n\n## [status:story] Ideen\nHier ist Platz für neue Gedanken.\n\n- Später umsetzen\n- [[Planung]]\n`;
let db,projects=[],docs=[],projectId=null,docId=null,view='mindmap',scopePath='0',currentModel=null,saveTimer;
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(store){return req(tx(store).getAll())}
async function put(store,value){return req(tx(store,'readwrite').put(value))}
async function del(store,key){return req(tx(store,'readwrite').delete(key))}
async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('mindstorm-db',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('docs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await refresh();if(!projects.length){let p={id:uid(),name:'Mein Workspace',created:Date.now()};await put('projects',p);await put('docs',{id:uid(),projectId:p.id,name:'Projekt',content:SAMPLE});}await refresh();projectId=localStorage.getItem('msProject');if(!projects.some(p=>p.id===projectId))projectId=projects[0].id;selectProject(projectId)}
async function refresh(){projects=await all('projects');docs=await all('docs')}
function project(){return projects.find(p=>p.id===projectId)}function documentNow(){return docs.find(d=>d.id===docId)}
function selectProject(id){projectId=id;localStorage.setItem('msProject',id);let pd=docs.filter(d=>d.projectId===id);let old=docId;docId=pd.some(d=>d.id===old)?old:pd[0]?.id||null;scopePath='0';render()}
function selectDocument(id){docId=id;scopePath='0';render()}
function nodeText(raw){let s=raw.trim();let m=s.match(/^\[([ xX])\]\s*/);let checked=null;if(m){checked=m[1].toLowerCase()==='x';s=s.slice(m[0].length)}let st=s.match(/^\[status:([a-z-]+)\]\s*/i);let status=null;if(st){status=st[1].toLowerCase();s=s.slice(st[0].length)}return {title:s.trim(),checked,status}}
function parseMarkdown(src){let lines=src.replace(/\r\n?/g,'\n').split('\n'),root={title:'Dokument',children:[],depth:0,path:'0',start:-1,end:lines.length,kind:'virtual',checked:null,status:null,description:[]},headings=[],listStack=[],last=root,fence=null,blocks=[];function newNode(title,kind,indent,level,line){let fields=nodeText(title);let parent;if(kind==='h'){while(headings.length&&headings[headings.length-1].level>=level)headings.pop();parent=headings.length?headings[headings.length-1].node:root;listStack=[]}else{while(listStack.length&&listStack[listStack.length-1].indent>=indent)listStack.pop();parent=listStack.length?listStack[listStack.length-1].node:(headings.length?headings[headings.length-1].node:root)}let n={...fields,children:[],parent,kind,level,indent,start:line,end:lines.length,description:[]};n.path=parent.path+'.'+parent.children.length;parent.children.push(n);if(kind==='h')headings.push({level,node:n});else listStack.push({indent,node:n});last=n;return n}
for(let i=0;i<lines.length;i++){let l=lines[i];let f=l.match(/^\s*(`{3,}|~{3,})/);if(f){if(!fence)fence=f[1][0];else if(f[1][0]===fence)fence=null;last.description.push(l);continue}if(fence){last.description.push(l);continue}let h=l.match(/^ {0,3}(#{1,6})(?:\s+(.+?)\s*#*\s*|\s*)$/),li=l.match(/^(\s*)(?:([-+*])|\d+[.)])\s+(.+)$/);if(h){newNode(h[2]||'Unbenannt','h',0,h[1].length,i);continue}if(li){newNode(li[3],'li',li[1].replace(/\t/g,'    ').length,0,i);continue}last.description.push(l)}
function close(n){for(const c of n.children)close(c);let next=lines.length;for(let i=n.start+1;i<lines.length;i++){if(/^( {0,3}#{1,6}\s|\s*(?:[-+*]|\d+[.)])\s)/.test(lines[i])){next=i;break}}n.end=next}close(root);
function progress(n){if(n.checked===true)return n.progress=100;if(!n.children.length)return n.progress=0;n.progress=n.children.reduce((s,c)=>s+progress(c),0)/n.children.length;return n.progress}function forceProgress(n){n.children.forEach(forceProgress);n.progress=n.checked===true?100:n.children.length?n.children.reduce((s,c)=>s+c.progress,0)/n.children.length:0}forceProgress(root);return root}
function flattened(root){let out=[];function rec(n){out.push(n);n.children.forEach(rec)}rec(root);return out}function actualRoot(m){return m.children.find(n=>n.kind==='h'&&n.level===1)||m.children[0]||m}
function currentRoot(){return actualRoot(currentModel)}function getScope(){return flattened(currentModel).find(n=>n.path===scopePath)||currentRoot()}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast._timer);toast._timer=setTimeout(()=>e.classList.add('hidden'),2600)}
function render(){let p=project(),d=documentNow();$('#projectLabel').innerHTML=`<select id="projectSelect" aria-label="Projekt auswählen">${projects.map(item=>`<option value="${item.id}" ${item.id===projectId?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`;$('#projectSelect').onchange=async e=>{let next=e.target.value;clearTimeout(saveTimer);if(view==='markdown')await saveSource();selectProject(next)};$('#docList').innerHTML=docs.filter(x=>x.projectId===projectId).map(x=>`<button class="navitem ${x.id===docId?'active':''}" data-doc="${x.id}"><span class="sym">▤</span><span>${escapeHtml(x.name)}</span></button>`).join('');document.querySelectorAll('[data-doc]').forEach(e=>e.onclick=()=>selectDocument(e.dataset.doc));$('#breadcrumb').textContent=`${p?.name||'Workspace'} / Dokumente`;$('#docTitle').textContent=d?.name||'Kein Dokument';$('#renameDoc').disabled=!d;$('#newNode').disabled=!d;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.view===view));if(!d){$('#surface').innerHTML='<div class="empty">Lege ein Dokument an, um zu beginnen.</div>';return}currentModel=parseMarkdown(d.content);if(!flattened(currentModel).some(n=>n.path===scopePath))scopePath=currentRoot().path;if(view==='mindmap')renderMindmap();if(view==='kanban')renderKanban();if(view==='markdown')renderEditor()}
function plain(s){return s.replace(/!?\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g,(_,d,h,a)=>a||h||d).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[*_`~]/g,'').trim()}
function treeHtml(n,root=false){return `<div class="treebranch"><button class="node ${root?'treeroot':''}" data-node="${escapeHtml(n.path)}"><span class="dot" style="background:${n.checked===true?'#70d4b3':n.status==='doing'?'#eabd72':'#a59aff'}"></span><span class="nodeinner"><span class="nodetitle">${escapeHtml(plain(n.title))}</span>${(n.checked!==null||n.children.length)?`<span class="nodefoot">${n.checked===true?'✓ ':''}${Math.round(n.progress)}% <span class="bar"><i style="width:${n.progress}%"></i></span></span>`:''}</span></button>${n.children.length?`<div class="children">${n.children.map(c=>treeHtml(c)).join('')}</div>`:''}</div>`}
function renderMindmap(){let root=currentRoot();$('#surface').innerHTML=`<div class="surfacehead"><span class="pill">✳ &nbsp; Mindmap · ${flattened(root).length} Knoten</span><span class="subtle">Klicken zum Bearbeiten · horizontal scrollen</span></div><div class="mindcanvas"><div class="mindtree">${treeHtml(root,true)}</div></div>`;document.querySelectorAll('[data-node]').forEach(e=>e.onclick=()=>editNode(e.dataset.node))}
function renderKanban(){let root=currentRoot(),all=flattened(root);let selected=all.find(n=>n.path===scopePath)||root;scopePath=selected.path;$('#surface').innerHTML=`<div class="surfacehead"><span class="pill">▥ &nbsp; Kanban · direkte Unterknoten</span><select class="scope" id="scopeSelect">${all.map(n=>`<option value="${n.path}" ${n.path===scopePath?'selected':''}>${escapeHtml(plain(n.title))}</option>`).join('')}</select></div><div class="kanban">${STATUS.map(st=>{let ns=selected.children.filter(n=>(n.status||'story')===st);return `<div class="lane"><div class="laneheading"><span>${STATUS_LABEL[st]}</span><span class="count">${ns.length}</span></div>${ns.map(n=>`<div class="ticket" data-open="${n.path}"><b>${escapeHtml(plain(n.title))}</b><small>${n.children.length?'▦ '+n.children.length+' Unterknoten · ':''}${Math.round(n.progress)}% Fortschritt</small><select data-status-node="${n.path}">${STATUS.map(s=>`<option value="${s}" ${s===(n.status||'story')?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select>${n.children.length?`<button class="btn" data-scope="${n.path}">Unterknoten ansehen →</button>`:''}</div>`).join('')}</div>`}).join('')}</div>`;$('#scopeSelect').onchange=e=>{scopePath=e.target.value;renderKanban()};document.querySelectorAll('[data-open]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('select,[data-scope]'))return;editNode(e.dataset.open)});document.querySelectorAll('[data-scope]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();scopePath=e.dataset.scope;renderKanban()});document.querySelectorAll('[data-status-node]').forEach(e=>e.onchange=async ev=>{ev.stopPropagation();await patchNode(e.dataset.statusNode,{status:e.value})})}
function renderEditor(){let d=documentNow();$('#surface').innerHTML=`<div class="surfacehead"><span class="pill">⌘ &nbsp; Markdown-Quelle</span><span class="subtle" id="saveLabel">Änderungen werden automatisch gespeichert</span></div><div class="editor"><textarea id="source" spellcheck="false" aria-label="Markdown-Quelltext"></textarea><div class="editfoot"><small>CommonMark · Checkboxen · [status:...] · [[Dokument#Überschrift]]</small></div></div>`;$('#source').value=d.content;$('#source').oninput=()=>{$('#saveLabel').textContent='Ungespeicherte Änderungen';clearTimeout(saveTimer);saveTimer=setTimeout(saveSource,650)}}
async function saveSource(){if(view!=='markdown')return;let d=documentNow();if(!d)return;d.content=$('#source').value;await put('docs',d);$('#saveLabel').textContent='Gespeichert ✓'}
function openModal(html){$('#modal').innerHTML=html;$('#modalBack').classList.remove('hidden')}function closeModal(){$('#modalBack').classList.add('hidden')};$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function formActions(label='Speichern'){return `<div class="modalactions"><button class="btn" type="button" id="cancelModal">Abbrechen</button><button class="btn primary" type="submit">${label}</button></div>`}function wireCancel(){$('#cancelModal').onclick=closeModal}
function createProject(){openModal(`<h2>Neues Projekt</h2><p>Projekte und Dokumente werden lokal in deinem Browser gespeichert.</p><form id="projectForm"><div class="field"><label>Projektname</label><input id="projectName" maxlength="90" required placeholder="Mein neues Projekt" autofocus></div>${formActions('Projekt erstellen')}</form>`);wireCancel();$('#projectForm').onsubmit=async e=>{e.preventDefault();let p={id:uid(),name:$('#projectName').value.trim(),created:Date.now()};if(!p.name)return;await put('projects',p);await refresh();selectProject(p.id);closeModal();toast('Projekt erstellt')}}
function createDocument(){if(!projectId)return createProject();openModal(`<h2>Neues Dokument</h2><p>Jedes Dokument besitzt einen eindeutigen Namen innerhalb des Projekts.</p><form id="docForm"><div class="field"><label>Dokumentname</label><input id="newDocName" required maxlength="100" placeholder="Planung"></div>${formActions('Dokument erstellen')}</form>`);wireCancel();$('#docForm').onsubmit=async e=>{e.preventDefault();let name=$('#newDocName').value.trim().replace(/\.md$/i,'');if(!name||docs.some(d=>d.projectId===projectId&&d.name.toLowerCase()===name.toLowerCase()))return toast('Dokumentname existiert bereits');let d={id:uid(),projectId,name,content:'# '+name+'\n'};await put('docs',d);await refresh();selectDocument(d.id);closeModal();toast('Dokument erstellt')}}
function renameDocument(){let d=documentNow();if(!d)return;openModal(`<h2>Dokument umbenennen</h2><form id="renameForm"><div class="field"><label>Name</label><input id="renameValue" required value="${escapeHtml(d.name)}"></div>${formActions()}</form>`);wireCancel();$('#renameForm').onsubmit=async e=>{e.preventDefault();let name=$('#renameValue').value.trim().replace(/\.md$/i,'');if(!name||docs.some(x=>x.projectId===projectId&&x.id!==d.id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Dokumentname bereits vergeben');d.name=name;await put('docs',d);closeModal();render()}}
function lineEdit(n,props){let d=documentNow(),ls=d.content.replace(/\r\n?/g,'\n').split('\n'),line=ls[n.start];if(line===undefined)return false;let prefix=n.kind==='h'?line.match(/^\s*#{1,6}\s*/)?.[0]:line.match(/^\s*(?:[-+*]|\d+[.)])\s+/)?.[0];if(!prefix)return false;let title=props.title??n.title,status=props.status===undefined?n.status:props.status,checked=props.checked===undefined?n.checked:props.checked;let parts=[];if(checked!==null)parts.push(checked?'[x]':'[ ]');if(status&&status!=='story')parts.push('[status:'+status+']');parts.push(title);ls[n.start]=prefix+parts.join(' ');d.content=ls.join('\n');return d}
async function patchNode(path,props){let n=flattened(currentModel).find(n=>n.path===path);if(!n)return;let d=lineEdit(n,props);if(d){await put('docs',d);render()}}
function editNode(path){let n=flattened(currentModel).find(n=>n.path===path);if(!n||n.kind==='virtual')return;let refs=[...n.title.matchAll(/\[\[([^\]#|]+)(?:#([^\]|]+))?(?:\|[^\]]+)?\]\]/g)];openModal(`<h2>Knoten bearbeiten</h2><p>Änderungen werden direkt in der Markdown-Datei gespeichert.</p><form id="nodeForm"><div class="field"><label>Titel (Markdown erlaubt)</label><input id="nodeTitle" required value="${escapeHtml(n.title)}"></div><div class="field"><label>Status</label><select id="nodeStatus">${STATUS.map(s=>`<option value="${s}" ${s===(n.status||'story')?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div><div class="field"><label>Checkbox</label><select id="nodeCheck"><option value="none" ${n.checked===null?'selected':''}>Keine Checkbox</option><option value="open" ${n.checked===false?'selected':''}>Offen [ ]</option><option value="done" ${n.checked===true?'selected':''}>Erledigt [x]</option></select></div><div class="field"><label>Beschreibung (Markdown)</label><textarea id="nodeDescription">${escapeHtml(n.description.join('\n').trim())}</textarea></div><div class="subtle">Berechneter Fortschritt: ${Math.round(n.progress)} % · ${n.children.length} direkte Unterknoten</div>${refs.length?`<div class="field"><label>Dokumentenverknüpfungen</label>${refs.map((m,i)=>`<button type="button" class="btn" data-link="${i}" style="text-align:left">↗ ${escapeHtml(m[0])}</button>`).join('')}</div>`:''}${formActions()}</form>`);wireCancel();document.querySelectorAll('[data-link]').forEach(el=>el.onclick=()=>navigateLink(refs[Number(el.dataset.link)][1],refs[Number(el.dataset.link)][2]));$('#nodeForm').onsubmit=async e=>{e.preventDefault();let d=lineEdit(n,{title:$('#nodeTitle').value.trim(),status:$('#nodeStatus').value,checked:$('#nodeCheck').value==='none'?null:$('#nodeCheck').value==='done'});if(!d)return;let lines=d.content.split('\n');let start=n.start+1;let end=start;while(end<lines.length&&!(/^( {0,3}#{1,6}\s|\s*(?:[-+*]|\d+[.)])\s)/.test(lines[end])))end++;let desc=$('#nodeDescription').value.trim();let oldSegment=lines.slice(start,end);let indent=n.kind==='li'?' '.repeat(n.indent+2):'';let replacement=desc?desc.split('\n').map(l=>l?indent+l:''):[];if(n.children.length){ // preserve children; only replace description before first child
  lines.splice(start,end-start,...replacement,...(replacement.length?['']:[]));
}else{lines.splice(start,end-start,...replacement)}
d.content=lines.join('\n');await put('docs',d);closeModal();render();toast('Knoten gespeichert')}}
function navigateLink(name,heading){let d=docs.find(x=>x.projectId===projectId&&x.name.toLowerCase()===name.toLowerCase());if(!d)return toast('Zieldokument nicht gefunden: '+name);docId=d.id;view='mindmap';scopePath='0';closeModal();render();if(heading){let target=flattened(currentModel).find(n=>n.kind==='h'&&plain(n.title).toLowerCase()===heading.toLowerCase());if(target){let el=[...document.querySelectorAll('[data-node]')].find(x=>x.dataset.node===target.path);el?.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});if(el)el.classList.add('selected')}else toast('Überschrift nicht gefunden: '+heading)}}
function addNode(){let root=currentRoot();let options=flattened(root);openModal(`<h2>Neuer Knoten</h2><p>Füge einen Listenknoten unter einer vorhandenen Überschrift oder Liste hinzu.</p><form id="addForm"><div class="field"><label>Übergeordneter Knoten</label><select id="parentSelect">${options.map(n=>`<option value="${n.path}">${escapeHtml(plain(n.title))}</option>`).join('')}</select></div><div class="field"><label>Titel</label><input id="addTitle" required placeholder="Neuer Gedanke"></div><div class="field"><label>Status</label><select id="addStatus">${STATUS.map(s=>`<option value="${s}">${STATUS_LABEL[s]}</option>`).join('')}</select></div>${formActions('Knoten hinzufügen')}</form>`);wireCancel();$('#addForm').onsubmit=async e=>{e.preventDefault();let parent=options.find(n=>n.path===$('#parentSelect').value),d=documentNow(),lines=d.content.split('\n');let indent=parent.kind==='li'?' '.repeat(parent.indent+2):'';let status=$('#addStatus').value;let line=indent+'- '+(status==='story'?'':'[status:'+status+'] ')+$('#addTitle').value.trim();let insertion=parent.kind==='h'?findHeadingEnd(lines,parent):findListEnd(lines,parent);lines.splice(insertion,0,line);d.content=lines.join('\n');await put('docs',d);closeModal();render();toast('Knoten hinzugefügt')}}
function findHeadingEnd(lines,n){let i=n.start+1;for(;i<lines.length;i++){let m=lines[i].match(/^ {0,3}(#{1,6})\s/);if(m&&m[1].length<=n.level)break}return i}function findListEnd(lines,n){let i=n.start+1;for(;i<lines.length;i++){let m=lines[i].match(/^(\s*)(?:[-+*]|\d+[.)])\s/);if(/^ {0,3}#{1,6}\s/.test(lines[i])||(m&&m[1].length<=n.indent))break}return i}
// ZIP stored-entry writer (no dependencies, works offline)
const enc=new TextEncoder(),dec=new TextDecoder();function crc32(data){let crc=-1;for(let b of data){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^-1)>>>0}
function makeZip(entries){let parts=[],central=[],offset=0;for(let [name,text] of entries){let nb=enc.encode(name),body=enc.encode(text),crc=crc32(body),head=new Uint8Array(30+nb.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,body.length,true);v.setUint32(22,body.length,true);v.setUint16(26,nb.length,true);head.set(nb,30);parts.push(head,body);let ch=new Uint8Array(46+nb.length),c=new DataView(ch.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,body.length,true);c.setUint32(24,body.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,offset,true);ch.set(nb,46);central.push(ch);offset+=head.length+body.length}let cdsize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,cdsize,true);e.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
async function readZip(buffer){let a=new Uint8Array(buffer),v=new DataView(buffer),pos=a.length-22;while(pos>=0&&v.getUint32(pos,true)!==0x06054b50)pos--;if(pos<0)throw Error('Ungültige ZIP-Datei');let count=v.getUint16(pos+10,true),at=v.getUint32(pos+16,true),out=[];for(let k=0;k<count;k++){if(v.getUint32(at,true)!==0x02014b50)throw Error('Ungültiger ZIP-Eintrag');let method=v.getUint16(at+10,true),size=v.getUint32(at+20,true),nl=v.getUint16(at+28,true),extra=v.getUint16(at+30,true),comment=v.getUint16(at+32,true),loc=v.getUint32(at+42,true),name=dec.decode(a.slice(at+46,at+46+nl)),start=loc+30+v.getUint16(loc+26,true)+v.getUint16(loc+28,true),bytes=a.slice(start,start+size);if(method===8){if(typeof DecompressionStream==='undefined')throw Error('Dieser Browser unterstützt komprimierte ZIP-Dateien nicht');let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}else if(method!==0)throw Error('Nicht unterstützte ZIP-Komprimierung');if(name&&!name.endsWith('/'))out.push([name,dec.decode(bytes)]);at+=46+nl+extra+comment}return out}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportProject(){let p=project();if(!p)return;let items=docs.filter(d=>d.projectId===p.id),entries=[['mindstorm-project.json',JSON.stringify({format:'mindstorm',version:1,name:p.name,documents:items.map(d=>({name:d.name,file:safeName(d.name)+'.md'}))},null,2)],...items.map(d=>[safeName(d.name)+'.md',d.content])];download(makeZip(entries),safeName(p.name)+'.zip');toast('Projekt exportiert')}
async function importProject(file){try{let entries=await readZip(await file.arrayBuffer()),meta=entries.find(x=>x[0]==='mindstorm-project.json'),pname=meta?JSON.parse(meta[1]).name:file.name.replace(/\.zip$/i,'');let mapping=meta?JSON.parse(meta[1]).documents:entries.filter(x=>x[0].endsWith('.md')).map(x=>({name:x[0].split('/').pop().replace(/\.md$/i,''),file:x[0]}));if(!mapping.length)throw Error('Keine Markdown-Dateien gefunden');let p={id:uid(),name:pname+' (Import)',created:Date.now()};await put('projects',p);for(let item of mapping){let found=entries.find(x=>x[0]===item.file);if(found)await put('docs',{id:uid(),projectId:p.id,name:item.name,content:found[1]})}await refresh();selectProject(p.id);toast('Projekt importiert')}catch(e){toast('Import fehlgeschlagen: '+e.message)}}
$('#addProject').onclick=createProject;$('#addDocument').onclick=createDocument;$('#renameDoc').onclick=renameDocument;$('#newNode').onclick=addNode;$('#exportZip').onclick=exportProject;$('#importZip').onclick=()=>$('#fileImport').click();$('#fileImport').onchange=async e=>{if(e.target.files[0])await importProject(e.target.files[0]);e.target.value=''};document.querySelectorAll('[data-view]').forEach(e=>e.onclick=async()=>{if(view==='markdown')await saveSource();view=e.dataset.view;render()});init().catch(e=>{console.error(e);toast('IndexedDB konnte nicht geöffnet werden')});
</script>
