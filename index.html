/* Mindstorm v3: syntax-aware source editor and interactive minimap. */
.editor{padding:14px 14px 16px;gap:9px}
.editor .codeframe{display:grid;grid-template-columns:43px minmax(0,1fr) 77px;flex:1;min-height:0;border:1px solid #35435a;border-radius:12px;overflow:hidden;background:#0c121d;box-shadow:inset 0 1px 0 #ffffff05}
.codegutter{position:relative;overflow:hidden;background:#101724;border-right:1px solid #273246;user-select:none}
.codegutter pre{position:absolute;left:0;top:0;width:100%;margin:0;padding:17px 0;white-space:pre;font:12px/23px ui-monospace,SFMono-Regular,Consolas,monospace;color:#66778f;pointer-events:none;will-change:transform}
.gline{display:block;height:23px;padding-right:9px;text-align:right;box-sizing:border-box}
.gline.h1{color:#c4b4ff;font-weight:700}
.gline.error{color:#ffc2cb;background:#772c3d3b}
.codepane{min-width:0;min-height:0;position:relative;overflow:hidden}
.syntaxlayer,.editor #source{font:13px/23px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0;tab-size:2;padding:17px 19px;white-space:pre;overflow-wrap:normal;word-break:normal}
.syntaxlayer{position:absolute;top:0;left:0;margin:0;min-width:max-content;min-height:100%;pointer-events:none;color:#a9b8cc;will-change:transform;z-index:1}
.editor #source{position:absolute;inset:0;width:100%;height:100%;min-height:0;resize:none;border:0!important;border-radius:0;outline:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#eeeaff;overflow:auto;scrollbar-width:none;overscroll-behavior:contain;z-index:2}
.editor #source::-webkit-scrollbar{width:0;height:0;display:none}

.editor #source:focus-visible{outline:none}
.codeframe:focus-within{border-color:#786fbb;box-shadow:0 0 0 1px #786fbb55}
.syn-line{color:#94a6bc}
.syn-line.syn-root{background:#aaa0ff13}
.syn-line.syn-invalid{background:#fc708325;text-decoration:underline;text-decoration-color:#f27f8e;text-decoration-style:wavy;text-underline-offset:3px}

.syn-codecontent{color:#8b9bb2}
.syn-quote{color:#a1ccb3}
.syn-table{color:#9db7d5}
.syn-comment{color:#66778f;font-style:italic}
.minimap{position:relative;min-width:0;overflow:hidden;background:#101724;border-left:1px solid #2c364b;cursor:ns-resize;touch-action:none;user-select:none;outline-offset:-3px;contain:layout paint}
.minimap:focus-visible{outline:2px solid var(--accent)}
.minimap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mini-viewport{position:absolute;left:0;right:0;border:1px solid #aaa1ff99;border-left:2px solid #b9acff;background:#857bd727;box-shadow:inset 0 0 0 1px #8c82ec22;pointer-events:none;border-radius:2px;min-height:18px}
.minimap::after{content:'MINIMAP';position:absolute;bottom:6px;right:5px;font:700 8px/1 ui-monospace,monospace;letter-spacing:.8px;color:#8696b0;opacity:.65;pointer-events:none}
.editor .editfoot{gap:8px;flex-wrap:wrap;min-height:30px}
.editor .editfoot small{font-size:11px}
.root-state{padding:6px 11px;border:1px solid #2e4c4d;background:#14302e;color:#9ddac9;border-radius:8px;font-size:11px;font-weight:700;text-align:left;cursor:default}

.modalback{z-index:45}

.mobile-menu,.rename-icon,.add-node-small,.sidebar-scrim{display:none}

/* Mindstorm v5: direct MMMD syntax controls, autocomplete and compact mobile title. */
/* The current document is shown in the breadcrumb; the save status is visible on mobile too. */
.editor .editor-tools{display:flex;align-items:center;gap:5px;overflow-x:auto;flex-shrink:0;min-height:37px;scrollbar-width:thin;scrollbar-color:#45536d transparent;overscroll-behavior-x:contain;padding:0 1px 3px}
.editor-tools .tool{flex:none;border:1px solid #36445c;border-radius:7px;background:#1c2635;color:#bfcce0;padding:6px 10px;font:650 11px/1.3 ui-sans-serif,system-ui,sans-serif;min-height:32px;white-space:nowrap}
.editor-tools .tool:hover,.editor-tools .tool:focus-visible{background:#34304f;color:#f0eaff;border-color:#8579d3}
.editor-tools .tool[data-tool="link"]{color:#7acde2}
.editor-tools .tool[data-tool="checkbox"]{color:#f0c980}

.code-interactions{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}

.token-hit:hover,.token-hit:focus-visible{border-color:#a59aff99;background:#a49aff22;outline:none}
.token-hit-checkbox{min-width:27px}

.token-hit-status:focus{border-color:#a59aff99;background:#a49aff20}
.token-hit-status option{color:#e9effb;-webkit-text-fill-color:#e9effb;background:#1a2433;font:13px ui-sans-serif,system-ui,sans-serif}
.completion-popup{position:absolute;z-index:6;width:290px;max-height:253px;overflow-y:auto;overscroll-behavior:contain;background:#1c2636;border:1px solid #627092;border-radius:11px;box-shadow:0 14px 38px #000b;padding:5px;touch-action:pan-y}
.completion-popup.hidden{display:none!important}
.completion-heading{color:#9daecd;text-transform:uppercase;font-size:9px;letter-spacing:.9px;font-weight:800;padding:6px 8px 5px}

/* mindstorm v7: heading selector and direct link navigation. */
.editor-tools .tool-heading{appearance:auto;-webkit-appearance:menulist;max-width:108px;padding-right:6px;color:#c5b4ff;cursor:pointer}

/* mindstorm v6: an accessible pan/zoom mindmap for touch and mouse. */
.mm-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline-offset:-3px}
.mm-viewport.is-panning{cursor:grabbing}
.mm-world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;pointer-events:none}
.mm-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mm-links path{fill:none;stroke:#66758f;stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.88}
.mm-node{position:absolute;width:196px;max-width:none;min-width:0;min-height:66px;padding:12px 13px;touch-action:none;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none;transform:none!important;transition:border-color .12s,box-shadow .12s}
.mm-node:active{cursor:grabbing}
.mm-node.is-dragging{border-color:#ccbfff;box-shadow:0 0 0 2px #9b8cff66,0 15px 38px #0008;z-index:2}
.mm-node .nodetitle{font-size:13px;line-height:1.4}
.mm-node .nodeinner{flex:1}
.mm-node .nodefoot{white-space:nowrap;flex-wrap:nowrap;gap:5px}
.mm-node .nodefoot .bar{flex:1;min-width:24px;width:auto}
.mm-node .draggrip{font-size:14px;color:#71819b;line-height:1;letter-spacing:-1px;align-self:center;pointer-events:none}
.mm-node.treeroot{width:210px;min-height:75px}
.mm-node.treeroot .nodetitle{font-size:15px}
.mm-controls{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:5px;padding:5px;border:1px solid #36445c;background:#141b29ed;border-radius:13px;box-shadow:0 8px 27px #0007;backdrop-filter:blur(8px)}
.mm-controls button{min-width:37px;height:38px;padding:0 9px;border-radius:8px;background:#232d3f;color:#e5ebfa;font-weight:750;font-size:18px;display:grid;place-items:center}
.mm-controls button:hover,.mm-controls button:focus-visible{background:#3a345a;color:white}
.mm-controls button.label{font-size:11px;min-width:53px;color:#c5bcff;font-variant-numeric:tabular-nums}
.mm-controls .mm-divider{width:1px;height:23px;background:#39465a;margin:0 2px}
@media(max-width:850px){
 .mm-controls{right:8px;bottom:max(8px,env(safe-area-inset-bottom));gap:4px;padding:4px}
 .mm-controls button{min-width:41px;height:42px;padding:0 8px;font-size:21px}
 .mm-controls button.label{min-width:50px;font-size:11px}
 .mm-node{min-height:69px;padding:12px 13px}
 .editor-tools .tool[data-tool="indent"],.editor-tools .tool[data-tool="outdent"]{color:#a9d8ce}
}

/* mindstorm v8: node types and streamlined view headings */
.surfacehead.editor-head,.surfacehead.kanban-head{justify-content:flex-end}
.surfacehead.kanban-head .scope{max-width:min(380px,95%)}
.node-type{flex:none;white-space:nowrap;color:#bdb0ff;background:#342c52;border:1px solid #564c80;border-radius:5px;padding:2px 5px;font:700 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.15px}
.nodetitle{display:block;white-space:normal;overflow-wrap:anywhere}
.ticket b{display:block;overflow-wrap:anywhere}
.node-type{display:inline-block;vertical-align:baseline;margin-right:6px}
.ticket .node-text,.nodetitle .node-text{display:inline;overflow-wrap:anywhere}
.treeroot .node-type{color:#eee9ff;background:#49417c;border-color:#7d70ca}
.token-hit-marker{cursor:pointer;border-radius:3px;min-width:12px}
.token-hit-marker:hover,.token-hit-marker:focus-visible{background:#9883ff4a;border-color:#c4b8ff;outline:none}
.field-note{color:var(--muted);font-size:11px;line-height:1.45}
@media(max-width:850px){.editor-tools .tool-heading{max-width:74px}.surfacehead.kanban-head{left:7px;right:7px}}

/* mindstorm v9: comfortable mobile dialog and deliberate Kanban long-press dragging */
.modal.node-modal{padding:18px 20px;max-height:calc(100dvh - 24px)}
.node-modal h2{font-size:19px;line-height:1.3;margin:0 0 8px}
.node-modal h2 label{display:block;cursor:text}
.node-form .field{margin:8px 0;gap:5px}
.node-form .field>input,.node-form .field>select{min-height:39px}
.node-properties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.node-properties>.field{min-width:0}
.node-modal .node-check-group{display:flex;flex-wrap:wrap;gap:10px 18px;padding:9px 10px}
.node-modal .node-check-group label{font-size:12px}
.node-modal #nodeDescription{min-height:200px;height:clamp(200px,31dvh,360px);resize:vertical}
.node-modal .modalactions{margin-top:12px}
.kanban .ticket{touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.kanban .ticket:active{cursor:grab}
.kanban .ticket.kb-drag-source{opacity:.33;border-style:dashed}
.kb-drag-ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.96;box-shadow:0 16px 44px #000d,0 0 0 2px #ada0ff!important;border-color:#b7aaff!important;transform:scale(1.03);transform-origin:center center;cursor:grabbing!important;overflow:hidden}
.kb-is-dragging,.kb-is-dragging *{cursor:grabbing!important}
.lane.kb-drop-target{border-color:#ac9cff;background:#252a45;box-shadow:inset 0 0 0 2px #8e80ff66}
@media(max-width:850px){
 .modal.node-modal{padding:13px 14px;max-height:calc(100dvh - 16px)}
 .node-form .field{margin:6px 0;gap:4px}
 .node-modal .node-check-group{padding:7px 9px}
 .node-modal #nodeDescription{min-height:200px}
}
/* mindstorm v10: structured Mindomo-style map; the hierarchy, not pixel offsets, determines placement. */
.mm-viewport{cursor:grab}
.mm-viewport.is-panning{cursor:grabbing}
.mm-world{pointer-events:none}
.mm-node{
  width:205px;min-height:68px;max-width:none;min-width:0;
  border-radius:12px;position:absolute;padding:12px 12px 12px 17px;
  cursor:grab;gap:9px;overflow:visible;
  --node-accent:#a99cff;
  transition:border-color .15s,box-shadow .15s,opacity .15s;
  z-index:1;
}
.mm-node.treeroot{width:218px;min-height:74px;padding:16px 14px 16px 19px!important}
.mm-node:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  border-radius:11px 0 0 11px;background:var(--node-accent);
  pointer-events:none;
}
.mm-node .nodeinner{flex:1;min-width:0}
.mm-node .nodefoot{gap:7px}
.mm-node .nodefoot .bar{min-width:28px}
.mm-node .nodetitle{font-size:13px;line-height:1.4}
.mm-node .node-type{margin-right:6px}
.mm-node:hover{transform:none;box-shadow:0 10px 25px #0003;border-color:#a59aff}
.mm-node.selected{z-index:3;border-color:#c0b5ff;box-shadow:0 0 0 2px #a99aff44,0 12px 28px #0005}
.mm-node.mm-drag-source{opacity:.36;border-style:dashed}
.mm-node.mm-drop-child{border-color:#81d9c9;box-shadow:0 0 0 3px #62d5c755,0 10px 25px #0004}
.mm-node.mm-drop-before:after,.mm-node.mm-drop-after:after{
  content:"";position:absolute;height:4px;left:-10px;right:-10px;
  background:#86e1d4;border-radius:5px;box-shadow:0 0 0 3px #62d5c72b;pointer-events:none;
}
.mm-node.mm-drop-before:after{top:-12px}
.mm-node.mm-drop-after:after{bottom:-12px}
.mm-node .mm-fold{
  position:relative;flex:none;width:25px;height:26px;display:grid;place-items:center;
  background:#354259;border:1px solid #52627d;border-radius:7px;
  color:#e0e8fa;cursor:pointer;align-self:center;padding:0;
}
.mm-node.treeroot .mm-fold{background:#7368ae;border-color:#a092e0}
.mm-node .mm-fold svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round}
.mm-node .mm-fold:hover,.mm-node .mm-fold:focus-visible{background:#6e64a6;color:#fff;border-color:#ac9fff}
.mm-node .dot,.mm-node .draggrip{display:none!important}
.mm-actions{
  position:absolute;z-index:7;display:flex;gap:4px;padding:5px;
  background:#182236f5;border:1px solid #637092;border-radius:11px;
  box-shadow:0 9px 30px #0009;pointer-events:auto;
}
.mm-actions button{width:31px;height:31px;padding:0;display:grid;place-items:center;border-radius:7px;background:transparent;color:#e5eafa;cursor:pointer}
.mm-actions button:not(:disabled):hover,.mm-actions button:not(:disabled):focus-visible{background:#3d395e;color:#fff}
.mm-actions button:disabled{opacity:.28;cursor:not-allowed}
.mm-actions button.danger:not(:disabled):hover{background:#613347;color:#ffc9d1}
.mm-actions svg,.mm-controls svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mm-controls{z-index:8;gap:7px;padding:7px;right:17px;bottom:17px}
.mm-controls button{width:44px;min-width:44px;height:43px;background:#26324a}
.mm-controls button:disabled{opacity:.28;cursor:not-allowed}
.mm-controls button:disabled:hover{background:#26324a;color:#e5ebfa}
.mm-controls button:not(:disabled):hover{background:#514678}
.mm-controls svg{width:22px;height:22px}
.mm-drop-hint{position:absolute;z-index:6;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100% - 150px);padding:8px 13px;
  border:1px solid #51897f;background:#1b3840ed;color:#c8fff1;border-radius:9px;font-size:11px;pointer-events:none;box-shadow:0 5px 20px #0006;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-drag-ghost{position:fixed!important;z-index:900!important;pointer-events:none!important;margin:0!important;opacity:.94;
  border-color:#c2b6ff!important;box-shadow:0 12px 36px #000b,0 0 0 2px #ada0ff44!important;will-change:left,top;transform-origin:top left!important;transition:none!important}
.mm-viewport.drag-active,.mm-viewport.drag-active *{cursor:grabbing!important}
@media(max-width:850px){
 .mm-node{width:195px;min-height:68px;padding:12px 10px 12px 16px}
 .mm-node.treeroot{width:209px;min-height:72px}
 .mm-actions{padding:4px;gap:2px}
 .mm-actions button{width:35px;height:35px}
 .mm-node .mm-fold{width:27px;height:29px}
 .mm-controls{right:10px;bottom:max(10px,env(safe-area-inset-bottom))}
 .mm-controls button{width:45px;min-width:45px;height:45px}
 .mm-drop-hint{left:12px;bottom:72px;max-width:calc(100% - 24px);transform:none}
}

/* mindstorm v11: document-wide undo/redo, Kanban refinements and map zoom. */
.top-actions .history-action{display:grid;place-items:center;flex:none;width:39px;height:39px;padding:0}
.history-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.history-action:disabled{opacity:.28;cursor:not-allowed}
.history-action:disabled:hover{background:#202a3a}
.mm-controls .mm-divider{height:27px;margin:0 1px}
.mm-controls button.mm-zoom{font-size:23px;font-weight:500;line-height:1}
.kanban .lane{--lane-accent:#b4a3ff}
.kanban .lane[data-lane-status="story"]{--lane-accent:#b6a4f9}
.kanban .lane[data-lane-status="todo"]{--lane-accent:#8ebdff}
.kanban .lane[data-lane-status="doing"]{--lane-accent:#eabc7c}
.kanban .lane[data-lane-status="review"]{--lane-accent:#e7a9d4}
.kanban .lane[data-lane-status="done"]{--lane-accent:#77d9b9}
.kanban .laneheading .count{color:var(--lane-accent);background:color-mix(in srgb,var(--lane-accent) 16%,#172031);border:1px solid color-mix(in srgb,var(--lane-accent) 34%,#172031);font-weight:750;min-width:27px;text-align:center}
.kanban .ticket{position:relative;overflow:hidden;padding-bottom:16px;gap:8px}
.kanban .ticket-progress{height:5px;position:absolute;bottom:0;left:0;right:0;background:#131d2c;overflow:hidden;pointer-events:none}
.kanban .ticket-progress>span{display:block;width:0;height:100%;background:#75d1bb;transition:width .16s ease}
.kanban .ticket .ticket-subcount{font-size:10px;color:#92a4bb}
.kanban .ticket .ticket-subcount:empty{display:none}
.kanban .ticket.kb-drag-source .ticket-progress{opacity:.5}
.kanban .ticket:focus-visible{outline:2px solid #a89aff;outline-offset:2px}
@media(max-width:850px){
  .editor .editfoot{display:none!important}
  .editor{padding-bottom:0}
  .top-actions .history-action{width:36px;height:36px;min-width:36px;padding:0}
  .kanban{padding:49px 5px 8px;gap:6px}
  .kanban .lane{min-width:160px;padding:6px;gap:6px;border-radius:9px}
  .kanban .laneheading{padding:1px 1px 5px;font-size:11px;gap:4px}
  .kanban .ticket{padding:8px 7px 13px;gap:6px;border-radius:7px}
  .kanban .ticket b{font-size:11px;line-height:1.35}
  .kanban .ticket [data-scope]{padding:5px 6px;font-size:10px}
  .kanban .ticket-progress{height:4px}
  .kanban .laneheading .count{min-width:22px;padding:0 5px}
}
@media(max-width:380px){
  .top-actions .history-action{width:34px;height:35px;min-width:34px}
  .kanban .lane{min-width:155px;padding:5px}
  .kanban .ticket{padding:7px 6px 12px}
}

/* mindstorm v12: inline node editing and persistent fold controls. */
.mm-node .mm-fold{
  position:absolute;top:50%;right:-13px;transform:translateY(-50%);
  z-index:5;width:26px;height:28px;margin:0;
  box-shadow:0 3px 12px #0005;
}
.mm-node.treeroot .mm-fold{right:-13px}
.mm-node:has(.mm-fold){padding-right:19px}
.mm-node .node-text{cursor:text;border-radius:3px}
.mm-node .node-text:hover{text-decoration:underline;text-decoration-color:#b7aaffaa;text-underline-offset:3px}
.mm-node .node-text:focus-visible{outline:2px solid #b7aaff;outline-offset:2px}
.mm-node.mm-inline-editing{cursor:default;z-index:6;min-height:112px}
.mm-node.mm-inline-editing .nodetitle{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%}
.mm-inline-editor{display:flex;flex-direction:column;gap:7px;width:100%;min-width:0;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.mm-inline-input{
  display:block;width:100%;min-width:0;max-width:100%;border:1px solid #9389e3;
  border-radius:6px;background:#10182a;color:#f4f2ff;font:650 13px/1.4 Inter,ui-sans-serif,system-ui,sans-serif;
  padding:7px 8px;outline:none;box-shadow:0 0 0 2px #a99aff1f;
  user-select:text;-webkit-user-select:text;touch-action:manipulation;
}
.mm-inline-input:focus{border-color:#c6bbff;box-shadow:0 0 0 2px #9b8cff55}
.mm-inline-actions{display:flex;gap:6px;justify-content:flex-end;align-items:center;width:100%}
.mm-inline-actions button{
  display:grid;place-items:center;flex:none;width:30px;height:28px;padding:0;
  border:1px solid #485971;border-radius:7px;background:#2b364b;color:#dfe7f6;
  cursor:pointer;touch-action:manipulation;
}
.mm-inline-actions button[data-inline-save]{background:#23493e;border-color:#367b68;color:#a9f0ce}
.mm-inline-actions button:hover,.mm-inline-actions button:focus-visible{border-color:#b2a8ff;background:#40395d;color:#fff}
.mm-inline-actions svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mm-inline-actions button:disabled{opacity:.4;cursor:wait}
@media(max-width:850px){
 .mm-node .mm-fold,.mm-node.treeroot .mm-fold{right:-13.5px;width:27px;height:29px}
 .mm-node.mm-inline-editing{min-height:115px}
 .mm-inline-input{font-size:16px}
 .mm-inline-actions button{width:35px;height:33px}
}
/* mindfagg v13: consolidated branding and persistent save feedback. */
.brand .mark{flex:none;overflow:hidden}
.brand .mark svg{display:block;filter:drop-shadow(0 1px 1px #30264b55)}
.brand>strong{font-size:21px;line-height:1.25;font-weight:750;letter-spacing:-.9px}
.top-title{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;min-width:0}
.top-title .eyebrow{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-indicator{display:block;color:#9dafc6;font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap}
.save-indicator[data-state="saving"]{color:#eac17a}
.save-indicator[data-state="error"]{color:#f07587}
@media(max-width:850px){
  .brand>strong{font-size:21px}
  .top-title{gap:3px}
  .save-indicator{font-size:10px}
}

/* mindfagg v14: project-specific status labels and colors. */
.projectlabel select{flex:1;width:auto}
.project-settings-button{flex:none;display:grid;place-items:center;width:31px;height:31px;border:1px solid #37445a;border-radius:7px;background:#202a3a;color:#c8b9ff;font-size:19px;line-height:1}
.project-settings-button:hover,.project-settings-button:focus-visible{background:#373251;border-color:#887cce;color:#fff}
.status-settings-grid{display:grid;gap:8px;margin-top:8px}
.status-setting-head,.status-setting-row{display:grid;grid-template-columns:79px minmax(0,1fr) 58px;align-items:center;gap:9px}
.status-setting-head{font-size:10px;font-weight:750;letter-spacing:.4px;text-transform:uppercase;color:#9dacbf}
.status-setting-row{padding:7px 9px;background:#131b29;border:1px solid #34425a;border-radius:9px}
.status-setting-row .status-code{font:650 11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:#a7b5cc}
.status-setting-row input[type=text]{min-width:0;padding:8px 9px}
.status-setting-row input[type=color]{width:45px;height:37px;min-width:0;justify-self:center;border:1px solid #53617b;border-radius:8px;background:#202a3b;padding:3px;cursor:pointer}
.status-settings-note{margin-top:10px}
.kanban .laneheading>span:first-child{color:var(--lane-accent)}
.kanban .ticket{border-left:3px solid var(--lane-accent)}
.mm-node .nodefoot .bar>i{background:var(--node-accent)}
.node-properties.single{grid-template-columns:minmax(0,1fr)}
@media(max-width:480px){.status-setting-head,.status-setting-row{grid-template-columns:64px minmax(0,1fr) 49px;gap:5px}.status-setting-row{padding:7px 5px}.status-setting-row input[type=color]{width:39px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="mainSidebar" aria-label="Hauptmenü"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="27" height="27" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.4 1.3 19.2 10l8.1-4.2-3.5 8.6 7.2 2.4-8 3.6 3.1 8.9-9-5-5.5 6.5-1.5-8.9-9.1 1.6 6.2-7-5.3-7.4 9.6 2.4 3.9-9.8Z" fill="currentColor"/><path d="m15 10.1-2.6 7.1h4l-1 5.8 5-9h-4Z" fill="#6A5BC8"/></svg></div><strong>mindfagg</strong></div><div class="side-section"><div class="side-head"><span>PROJEKTE</span><button class="iconbtn" id="addProject" title="Projekt hinzufügen">+</button></div><div class="projectlabel" id="projectLabel"><select id="projectSelect" aria-label="Projekt auswählen"><option>Kein Projekt</option></select><button type="button" class="project-settings-button" id="projectSettings" aria-label="Projekteinstellungen" title="Projekteinstellungen">⚙</button></div><div class="side-head"><span>DOKUMENTE</span><button class="iconbtn" id="addDocument" title="Dokument hinzufügen">+</button></div><div class="navlist" id="docList"></div></div><div class="side-footer"><button id="exportZip">⇩ &nbsp; Projekt exportieren</button><button id="importZip">⇧ &nbsp; ZIP importieren</button><input id="fileImport" type="file" accept=".zip,application/zip" class="hidden"></div></aside>
<div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>
<main class="main"><header class="topbar"><button class="mobile-menu" id="menuToggle" aria-label="Hauptmenü öffnen" title="Hauptmenü" aria-controls="mainSidebar" aria-expanded="false"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="top-title"><div class="eyebrow" id="breadcrumb">WORKSPACE / PROJEKT</div><span class="save-indicator" id="saveLabel" role="status" aria-live="polite" data-state="saved">Automatisch gespeichert</span></div><div class="top-actions"><button class="btn rename-btn" id="renameDoc" aria-label="Dokument umbenennen" title="Dokument umbenennen"><svg class="rename-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L10 16l-4 1 1-4z"/><path d="m15 5 4 4"/></svg><span class="rename-label">Umbenennen</span></button><button type="button" class="btn history-action" id="undoAction" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button><button type="button" class="btn history-action" id="redoAction" title="Wiederherstellen (Strg+Umschalt+Z)" aria-label="Wiederherstellen" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg></button></div></header><div class="tabsbar"><div class="tabs"><button class="tab active" data-view="mindmap">✳ &nbsp; Mindmap</button><button class="tab" data-view="kanban">▥ &nbsp; Kanban</button><button class="tab" data-view="markdown">⌘ &nbsp; Markdown</button></div></div><div class="workspace"><section class="surface" id="surface"></section></div></main>
</div><div class="modalback hidden" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS=['story','todo','doing','review','done'];
const DEFAULT_STATUS_SETTINGS={
  story:{label:'Story',color:'#a99cff'},
  todo:{label:'To Do',color:'#8ebdff'},
  doing:{label:'In Progress',color:'#eabc7c'},
  review:{label:'Review',color:'#e2a4d6'},
  done:{label:'Done',color:'#70d8b5'}
};
function statusSetting(key,p=project()){
  const fallback=DEFAULT_STATUS_SETTINGS[key]||DEFAULT_STATUS_SETTINGS.story;
  const item=p?.statusSettings?.[key];
  const label=typeof item?.label==='string'?item.label.replace(/\s+/g,' ').trim().slice(0,36):'';
  const color=typeof item?.color==='string'&&/^#[0-9a-f]{6}$/i.test(item.color)?item.color.toLowerCase():fallback.color;
  return {label:label||fallback.label,color};
}
function statusLabel(key){return statusSetting(key).label}
function statusColor(key){return statusSetting(key).color}
function statusSettingsFor(p){return Object.fromEntries(STATUS.map(key=>[key,statusSetting(key,p)]))}

const SAMPLE=`# [ ] Mein Projekt\nEine zentrale Mindmap für Ideen, Aufgaben und Fortschritt.\n\n## [status:done] Planung\nDie Anforderungen und das Konzept werden vorbereitet.\n\n- [x] Ziele definieren\n- [x] Anforderungen sammeln\n\n## [status:doing] Entwicklung\nDie App wird Schritt für Schritt umgesetzt.\n\n- [x] Markdown-Parser\n- [ ] [status:doing] Mindmap-Ansicht\n- [ ] [status:todo] Kanban-Ansicht\n- [ ] [status:review] Dokumentation\n\n## Ideen\nHier ist Platz für neue Gedanken.\n\n- [ ] Später umsetzen\n- [[Planung]]\n`;
let db,projects=[],docs=[],projectId=null,docId=null,view='mindmap',scopePath='0',currentModel=null,saveTimer;
const VIEWS=['mindmap','kanban','markdown'];
function setView(next){if(!VIEWS.includes(next))return;view=next;try{localStorage.setItem('msView',next)}catch(e){console.warn('Ansicht konnte nicht gespeichert werden:',e)}}
function setMobileMenu(open){const mobile=window.matchMedia('(max-width:850px)').matches;const active=mobile&&Boolean(open);$('.app').classList.toggle('menu-open',active);$('#mainSidebar').inert=mobile&&!active;$('#menuToggle').setAttribute('aria-expanded',String(active));$('#menuToggle').setAttribute('aria-label',active?'Hauptmenü schließen':'Hauptmenü öffnen')}

const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(store){return req(tx(store).getAll())}
// Undo/redo stores content and document names per document. Typing is grouped by autosave pauses.
const docHistory=new Map(),persistedDocSnapshots=new Map();
let historyBusy=false;
function docSnapshot(doc){return {content:doc.content,name:doc.name,mapCollapsedPaths:Array.isArray(doc.mapCollapsedPaths)?[...doc.mapCollapsedPaths]:[]}}
function equalDocSnapshot(a,b){return a?.content===b?.content&&a?.name===b?.name}
function docHistoryFor(id){
  if(!docHistory.has(id))docHistory.set(id,{undo:[],redo:[]});
  return docHistory.get(id);
}
// A single persistent save indicator is shared by Mindmap, Kanban and Markdown.
// Uses the new mindfagg-db; no old database is read or migrated.
const pendingDocWrites=new Map(),failedDocWrites=new Set();
function updateSaveStatus(){
  const label=$('#saveLabel');if(!label)return;
  const doc=documentNow();
  const failed=!!doc&&failedDocWrites.has(doc.id);
  const pending=!!doc&&((pendingDocWrites.get(doc.id)||0)>0||!equalDocSnapshot(docSnapshot(doc),persistedDocSnapshots.get(doc.id)));
  const state=failed?'error':pending?'saving':'saved';
  label.dataset.state=state;
  label.textContent=state==='error'?'Speichern fehlgeschlagen':state==='saving'?'Wird gespeichert …':doc?'Gespeichert ✓':'Automatisch gespeichert';
}
function updateHistoryButtons(){
  const d=documentNow(),h=d?docHistory.get(d.id):null;
  const hasUnsaved=!!d&&!equalDocSnapshot(docSnapshot(d),persistedDocSnapshots.get(d.id));
  const undo=$('#undoAction'),redo=$('#redoAction');
  if(undo)undo.disabled=historyBusy||!d||!((h?.undo.length||0)>0||hasUnsaved);
  if(redo)redo.disabled=historyBusy||!d||!((h?.redo.length||0)>0);
}
async function put(store,value,options={}){
  const isDoc=store==='docs';
  const before=isDoc?persistedDocSnapshots.get(value.id):null;
  if(isDoc){
    pendingDocWrites.set(value.id,(pendingDocWrites.get(value.id)||0)+1);
    failedDocWrites.delete(value.id);
    updateSaveStatus();
  }
  try{
    const result=await req(tx(store,'readwrite').put(value));
    if(isDoc){
      const after=docSnapshot(value);
      if(before&&!equalDocSnapshot(before,after)&&options.record!==false){
        const h=docHistoryFor(value.id);
        h.undo.push({...before});if(h.undo.length>100)h.undo.shift();
        h.redo.length=0;
      }
      persistedDocSnapshots.set(value.id,after);
    }
    return result;
  }catch(error){
    if(isDoc)failedDocWrites.add(value.id);
    throw error;
  }finally{
    if(isDoc){
      const pending=(pendingDocWrites.get(value.id)||1)-1;
      if(pending>0)pendingDocWrites.set(value.id,pending);
      else pendingDocWrites.delete(value.id);
      updateHistoryButtons();
      updateSaveStatus();
    }
  }
}
async function changeHistory(direction){
  if(historyBusy||!documentNow())return;
  historyBusy=true;updateHistoryButtons();
  try{
    // Commit pending Markdown edits first, so a click during the autosave delay still works.
    if(view==='markdown')await flushSource();
    const d=documentNow(),h=docHistoryFor(d.id);
    const from=direction==='undo'?h.undo:h.redo;
    const other=direction==='undo'?h.redo:h.undo;
    if(!from.length)return;
    const target=from.pop(),current=docSnapshot(d);
    other.push({...current});if(other.length>100)other.shift();
    d.content=target.content;d.name=target.name;d.mapCollapsedPaths=[...(target.mapCollapsedPaths||[])];
    try{await put('docs',{...d},{record:false})}
    catch(e){
      d.content=current.content;d.name=current.name;d.mapCollapsedPaths=[...(current.mapCollapsedPaths||[])];
      other.pop();from.push(target);console.error(e);toast('Verlauf konnte nicht gespeichert werden');return;
    }
    clearTimeout(saveTimer);
    // Paths can change after undo/redo; don't attach the toolbar to an unrelated node.
    mapSelectedPaths.delete(d.id);mapCollapsedPaths.set(d.id,new Set(d.mapCollapsedPaths));
    const editorCursor=view==='markdown'?$('#source')?.selectionStart:null;
    const editorScroll=view==='markdown'?$('#source')?.scrollTop:null;
    render();
    if(view==='markdown'&&editorCursor!==null){
      const source=$('#source');if(source){const i=Math.min(editorCursor,source.value.length);source.setSelectionRange(i,i);source.scrollTop=editorScroll||0;syncCodeScroll()}
    }
    toast(direction==='undo'?'Änderung rückgängig gemacht':'Änderung wiederhergestellt');
  }finally{historyBusy=false;updateHistoryButtons()}
}
async function del(store,key){return req(tx(store,'readwrite').delete(key))}
async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('mindfagg-db',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('docs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await refresh();if(!projects.length){let p={id:uid(),name:'Mein Workspace',created:Date.now(),statusSettings:statusSettingsFor(null)};await put('projects',p);await put('docs',{id:uid(),projectId:p.id,name:'Projekt',content:SAMPLE});}await refresh();try{const lastView=localStorage.getItem('msView');if(VIEWS.includes(lastView))view=lastView}catch(e){console.warn('Letzte Ansicht konnte nicht geladen werden:',e)}projectId=localStorage.getItem('msProject');if(!projects.some(p=>p.id===projectId))projectId=projects[0].id;selectProject(projectId)}
async function refresh(){projects=await all('projects');docs=await all('docs');for(const d of docs)persistedDocSnapshots.set(d.id,docSnapshot(d));updateHistoryButtons()}
function project(){return projects.find(p=>p.id===projectId)}function documentNow(){return docs.find(d=>d.id===docId)}
function selectProject(id){setMobileMenu(false);projectId=id;localStorage.setItem('msProject',id);let pd=docs.filter(d=>d.projectId===id);let old=docId;docId=pd.some(d=>d.id===old)?old:pd[0]?.id||null;scopePath='0';render()}
function selectDocument(id){setMobileMenu(false);docId=id;scopePath='0';render()}

// A shared scanner keeps root validation, highlighting and the tree parser consistent.
function scanMarkdown(source){
  const text=String(source).replace(/\r\n?/g,'\n'),ls=text.split('\n'),items=[],h1=[];let fence=null;
  for(let i=0;i<ls.length;i++){
    const raw=ls[i];let item={raw,line:i,kind:'description'};
    if(fence){
      const closing=raw.match(/^\s*(`{3,}|~{3,})[ \t]*$/);
      if(closing&&closing[1][0]===fence.char&&closing[1].length>=fence.size){item.kind='fence';fence=null}
      else item.kind='code';
      items.push(item);continue;
    }
    const opener=raw.match(/^\s*(`{3,}|~{3,})(.*)$/);
    if(opener){item.kind='fence';fence={char:opener[1][0],size:opener[1].length};items.push(item);continue}
    const thematic=/^ {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/.test(raw);
    const heading=raw.match(/^ {0,3}(#{1,6})(?:[ \t]+(.*)|[ \t]*)$/);
    const list=thematic?null:raw.match(/^([ \t]*)(?:([-+*])|(\d+[.)]))[ \t]+(.+)$/);
    if(heading){item.kind='heading';item.level=heading[1].length;item.prefix=raw.slice(0,raw.indexOf(heading[1])+heading[1].length);item.title=(heading[2]||'').replace(/[ \t]+#+[ \t]*$/,'').trim();if(item.level===1)h1.push(i)}
    else if(list){item.kind='list';item.indent=list[1].replace(/\t/g,'    ').length;item.prefix=raw.slice(0,raw.length-list[4].length);item.marker=list[2]||list[3];item.title=list[4]}
    else if(/^\s*>/.test(raw))item.kind='quote';
    else if(/^\s*\|/.test(raw))item.kind='table';
    else if(/^\s*<!--/.test(raw))item.kind='comment';
    items.push(item);
  }
  const offsets=[];let offset=0;for(const line of ls){offsets.push(offset);offset+=line.length+1}
  return {lines:ls,items,roots:h1,valid:h1.length===1,offsets};
}
function validationMessage(scan){
  if(scan.roots.length===1)return '1 / 1 H1 · gültiger Root';
  if(!scan.roots.length)return 'Keine H1 · # Titel ergänzen';
  return scan.roots.length+' H1 gefunden · nur eine erlaubt (Zeilen '+scan.roots.slice(1).map(i=>i+1).join(', ')+')';
}
function nodeText(raw){
  let s=raw.trim(),checked=null,status=null;
  for(let i=0;i<2;i++){
    let box=s.match(/^\[([ xX])\](?:\s+|$)/);
    if(box&&checked===null){checked=box[1].toLowerCase()==='x';s=s.slice(box[0].length);continue}
    let st=s.match(/^\[status:([a-z-]+)\](?:\s+|$)/i);
    if(st&&status===null){status=st[1].toLowerCase();s=s.slice(st[0].length);continue}
    break;
  }
  return {title:s.trim(),checked,status};
}


function parseMarkdown(src,analysis){
  const scan=analysis||scanMarkdown(src),ls=scan.lines;
  const root={title:'Dokument',children:[],depth:0,path:'0',start:-1,end:ls.length,kind:'virtual',checked:null,status:null,description:[]};
  let headings=[],listStack=[],last=root;
  function addNode(item){
    let parent;
    if(item.kind==='heading'){
      while(headings.length&&headings[headings.length-1].level>=item.level)headings.pop();
      parent=headings.length?headings[headings.length-1].node:root;
      listStack=[];
    }else{
      while(listStack.length&&listStack[listStack.length-1].indent>=item.indent)listStack.pop();
      parent=listStack.length?listStack[listStack.length-1].node:(headings.length?headings[headings.length-1].node:root);
    }
    const n={...nodeText(item.title),children:[],parent,kind:item.kind==='heading'?'h':'li',level:item.level||0,marker:item.marker||null,indent:item.indent||0,start:item.line,end:ls.length,description:[]};
    n.path=parent.path+'.'+parent.children.length;
    parent.children.push(n);
    if(item.kind==='heading')headings.push({level:item.level,node:n});
    else listStack.push({indent:item.indent,node:n});
    last=n;
  }
  for(const item of scan.items){
    if(item.kind==='heading'||item.kind==='list')addNode(item);
    else last.description.push(item.raw);
  }
  const nodeLines=scan.items.filter(i=>i.kind==='heading'||i.kind==='list').map(i=>i.line);
  function close(n){
    for(const c of n.children)close(c);
    n.end=nodeLines.find(i=>i>n.start)??ls.length;
  }
  close(root);
  function forceProgress(n){
    n.children.forEach(forceProgress);
    n.progress=n.checked===true?100:n.children.length?n.children.reduce((s,c)=>s+c.progress,0)/n.children.length:0;
  }
  forceProgress(root);return root;
}




function flattened(root){let out=[];function rec(n){out.push(n);n.children.forEach(rec)}rec(root);return out}function actualRoot(m){return m.children.find(n=>n.kind==='h'&&n.level===1)||m.children[0]||m}
function currentRoot(){return actualRoot(currentModel)}function getScope(){return flattened(currentModel).find(n=>n.path===scopePath)||currentRoot()}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast._timer);toast._timer=setTimeout(()=>e.classList.add('hidden'),2600)}

function render(){
  let p=project(),d=documentNow();
  $('#projectLabel').innerHTML=`<select id="projectSelect" aria-label="Projekt auswählen">${projects.map(item=>`<option value="${item.id}" ${item.id===projectId?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select><button type="button" class="project-settings-button" id="projectSettings" aria-label="Projekteinstellungen" title="Status-Bezeichnungen und -Farben bearbeiten">⚙</button>`;
  $('#projectSelect').onchange=async e=>{await flushSource();selectProject(e.target.value)};
  $('#projectSettings').onclick=async()=>{await flushSource();setMobileMenu(false);openProjectSettings()};
  $('#docList').innerHTML=docs.filter(x=>x.projectId===projectId).map(x=>`<button class="navitem ${x.id===docId?'active':''}" data-doc="${x.id}"><span class="sym">▤</span><span>${escapeHtml(x.name)}</span></button>`).join('');
  document.querySelectorAll('[data-doc]').forEach(e=>e.onclick=async()=>{await flushSource();selectDocument(e.dataset.doc)});
  $('#breadcrumb').textContent=`${p?.name||'Workspace'} / ${d?.name||'Kein Dokument'}`;
  $('#renameDoc').disabled=!d;
  updateHistoryButtons();
  updateSaveStatus();
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.view===view));
  if(editorResizeObserver){editorResizeObserver.disconnect();editorResizeObserver=null}
  if(!d){$('#surface').innerHTML='<div class="empty">Lege ein Dokument an, um zu beginnen.</div>';return}
  const inspection=scanMarkdown(d.content);
  currentModel=parseMarkdown(d.content,inspection);
  if(!flattened(currentModel).some(n=>n.path===scopePath))scopePath=currentRoot().path;
  if(view!=='mindmap')activeMap=null;
  if(view==='markdown'){renderEditor();return}
  if(!inspection.valid){
    $('#surface').innerHTML=`<div class="source-invalid"><div class="warningicon">!</div><h2>Dokumentstruktur prüfen</h2><p>${escapeHtml(validationMessage(inspection))}. Eine Mindmap benötigt genau eine Überschrift der Ebene 1 (<code># Titel</code>). Der Markdown-Text ist weiterhin gespeichert.</p><button class="btn primary" id="fixRoot">Im Markdown-Editor korrigieren</button></div>`;
    $('#fixRoot').onclick=()=>{setView('markdown');render();focusRootProblem()};return;
  }
  if(view==='mindmap')renderMindmap();
  if(view==='kanban')renderKanban();
}

function plain(s){return s.replace(/!?\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g,(_,d,h,a)=>a||h||d).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[*_`~]/g,'').trim()}
// The type is read from the original Markdown marker, not inferred from status.
function nodeTypeLabel(n){
  if(n.kind==='h')return 'H'+n.level;
  if(n.kind==='li')return n.marker||'-';
  return '';
}
function nodeTypeValue(n){
  if(n.kind==='h')return 'h'+n.level;
  const marker=n.marker||'-';
  if(/^\d+\.$/.test(marker))return 'ol.';
  if(/^\d+\)$/.test(marker))return 'ol)';
  return 'ul'+marker;
}
const NODE_TYPES=[
  ...[1,2,3,4,5,6].map(level=>({value:'h'+level,label:'H'+level+' · '+ '#'.repeat(level)+' · Überschrift '+level})),
  {value:'ul-',label:'- · Unsortierte Liste'},
  {value:'ul*',label:'* · Unsortierte Liste'},
  {value:'ul+',label:'+ · Unsortierte Liste'},
  {value:'ol.',label:'1. · Nummerierte Liste (Punkt)'},
  {value:'ol)',label:'1) · Nummerierte Liste (Klammer)'}
];
function labeledNodeTitle(n){
  return `<span class="node-type">${escapeHtml(nodeTypeLabel(n))}</span><span class="node-text">${escapeHtml(plain(n.title))}</span>`;
}
// mindstorm v10: Mindomo-inspired structured tree layout and real Markdown drag-and-drop.
// Node coordinates are a function of the hierarchy; dragging edits the Markdown tree.
const mapSessionViews=new Map(),mapSelectedPaths=new Map(),mapCollapsedPaths=new Map();
let activeMap=null,mapResizeObserver=null;
function clamp(x,min,max){return Math.min(max,Math.max(min,x))}
function mapCollapsed(docId){
  if(!mapCollapsedPaths.has(docId)){
    const doc=docs.find(d=>d.id===docId);
    const paths=Array.isArray(doc?.mapCollapsedPaths)?doc.mapCollapsedPaths:[];
    mapCollapsedPaths.set(docId,new Set(paths.filter(p=>typeof p==='string')));
  }
  return mapCollapsedPaths.get(docId);
}
async function persistMapCollapsed(docId){
  const doc=docs.find(d=>d.id===docId);
  if(!doc)return;
  doc.mapCollapsedPaths=[...mapCollapsed(docId)];
  try{await put('docs',{...doc},{record:false})}
  catch(error){console.error(error);toast('Aufklappzustand konnte nicht gespeichert werden')}
}
function mapLayout(root,collapsed){
  const rows=[],links=[];
  function visit(node,depth,parent=null){
    const row={node,path:node.path,depth,parent,children:[],width:depth===0?218:205,x:0,y:0,height:70,branchHeight:0,el:null};
    rows.push(row);
    if(parent){parent.children.push(row);links.push([parent,row])}
    if(!collapsed.has(node.path))node.children.forEach(child=>visit(child,depth+1,row));
    return row;
  }
  return {rows,links,rootRow:visit(root,0)};
}
function mapStatusColor(n){
  return n.status&&STATUS.includes(n.status)?statusColor(n.status):n.checked===true?statusColor('done'):statusColor('story');
}
const mapIcons={
  edit:'<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L10 16l-4 1 1-4z"/>',
  copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  delete:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',
  child:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
  sibling:'<path d="M5 4v8a4 4 0 0 0 4 4h11m-6-6 6 6-6 6"/>',
  fit:'<path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/>'
};
function mapSvg(icon){return `<svg viewBox="0 0 24 24" aria-hidden="true">${mapIcons[icon]}</svg>`}
function mapNodeHtml(row,root){
  const n=row.node,hasChildren=n.children.length>0,collapsed=mapCollapsed(documentNow().id).has(n.path);
  const progress=(n.checked!==null||hasChildren)?`<span class="nodefoot">${n.checked===true?'✓ ':''}${Math.round(n.progress)} % <span class="bar"><i style="width:${n.progress}%"></i></span></span>`:'';
  const fold=hasChildren?`<button type="button" class="mm-fold" data-map-fold="${escapeHtml(n.path)}" aria-label="Unterknoten ${collapsed?'einblenden':'ausblenden'}" title="Unterknoten ${collapsed?'einblenden':'ausblenden'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/>${collapsed?'<path d="M12 5v14"/>':''}</svg></button>`:'';
  return `<div class="node mm-node ${root?'treeroot':''}" role="button" tabindex="0" data-map-node="${escapeHtml(n.path)}"
    style="left:${row.x}px;top:${row.y}px;--node-accent:${mapStatusColor(n)}"
    aria-label="${escapeHtml(nodeTypeLabel(n)+' '+plain(n.title))}; auswählen oder ziehen"
    aria-selected="false" ${hasChildren?`aria-expanded="${!collapsed}"`:''} title="Auswählen · Ziehen zum Sortieren oder Umhängen · Doppelklick zum Bearbeiten">
    <span class="nodeinner"><span class="nodetitle">${labeledNodeTitle(n)}</span>${progress}</span>${fold}</div>`;
}
function positionMapRows(state){
  const gap=22,step=286;
  function measure(r){
    r.height=Math.max(64,r.el?.offsetHeight||70);
    r.width=r.el?.offsetWidth||r.width;
    const total=r.children.reduce((s,c)=>s+measure(c),0)+Math.max(0,r.children.length-1)*gap;
    r.branchHeight=Math.max(r.height,total);
    return r.branchHeight;
  }
  function place(r,top){
    r.x=74+r.depth*step;
    r.y=top+(r.branchHeight-r.height)/2;
    const total=r.children.reduce((s,c)=>s+c.branchHeight,0)+Math.max(0,r.children.length-1)*gap;
    let childTop=top+(r.branchHeight-total)/2;
    for(const child of r.children){place(child,childTop);childTop+=child.branchHeight+gap}
    if(r.el){r.el.style.left=r.x+'px';r.el.style.top=r.y+'px'}
  }
  measure(state.rootRow);place(state.rootRow,104);
}
function mapBounds(state){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const row of state.rows){
    minX=Math.min(minX,row.x);minY=Math.min(minY,row.y);
    maxX=Math.max(maxX,row.x+row.width);maxY=Math.max(maxY,row.y+row.height);
  }
  return {minX,minY,maxX,maxY};
}
function drawMapLinks(state){
  if(activeMap!==state)return;
  const bounds=mapBounds(state);

const SYN_TOKENS=/(\[\[([^\]]+)\]\]|\[[^\]]+\]\([^)]+\)|`[^`]*`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_)/g;

function createProject(){openModal(`<h2>Neues Projekt</h2><p>Projekte und Dokumente werden lokal in deinem Browser gespeichert.</p><form id="projectForm"><div class="field"><label>Projektname</label><input id="projectName" maxlength="90" required placeholder="Mein neues Projekt" autofocus></div>${formActions('Projekt erstellen')}</form>`);wireCancel();$('#projectForm').onsubmit=async e=>{e.preventDefault();let p={id:uid(),name:$('#projectName').value.trim(),created:Date.now(),statusSettings:statusSettingsFor(null)};if(!p.name)return;await put('projects',p);await refresh();selectProject(p.id);closeModal();toast('Projekt erstellt')}}
function createDocument(){if(!projectId)return createProject();openModal(`<h2>Neues Dokument</h2><p>Jedes Dokument besitzt einen eindeutigen Namen innerhalb des Projekts.</p><form id="docForm"><div class="field"><label>Dokumentname</label><input id="newDocName" required maxlength="100" placeholder="Planung"></div>${formActions('Dokument erstellen')}</form>`);wireCancel();$('#docForm').onsubmit=async e=>{e.preventDefault();let name=$('#newDocName').value.trim().replace(/\.md$/i,'');if(!name||docs.some(d=>d.projectId===projectId&&d.name.toLowerCase()===name.toLowerCase()))return toast('Dokumentname existiert bereits');let d={id:uid(),projectId,name,content:'# '+name+'\n'};await put('docs',d);await refresh();selectDocument(d.id);closeModal();toast('Dokument erstellt')}}
function renameDocument(){let d=documentNow();if(!d)return;openModal(`<h2>Dokument umbenennen</h2><form id="renameForm"><div class="field"><label>Name</label><input id="renameValue" required value="${escapeHtml(d.name)}"></div>${formActions()}</form>`);wireCancel();$('#renameForm').onsubmit=async e=>{e.preventDefault();let name=$('#renameValue').value.trim().replace(/\.md$/i,'');if(!name||docs.some(x=>x.projectId===projectId&&x.id!==d.id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Dokumentname bereits vergeben');d.name=name;await put('docs',d);closeModal();render()}}
function lineEdit(n,props){
  const d=documentNow(),ls=d.content.replace(/\r\n?/g,'\n').split('\n'),line=ls[n.start];
  if(line===undefined)return false;
  const oldPrefix=n.kind==='h'?line.match(/^\s*#{1,6}\s*/)?.[0]:line.match(/^\s*(?:[-+*]|\d+[.)])\s+/)?.[0];
  if(!oldPrefix)return false;
  const type=props.nodeType??nodeTypeValue(n);
  const leading=(line.match(/^\s*/)||[''])[0];
  let prefix;
  if(/^h[1-6]$/.test(type)){
    prefix=(n.kind==='h'?leading.slice(0,3):'')+'#'.repeat(Number(type.slice(1)))+' ';
  }else if(/^ul[-+*]$/.test(type)){
    prefix=(n.kind==='li'?leading:'')+type.slice(2)+' ';
  }else if(type==='ol.'||type==='ol)'){
    const num=n.kind==='li'&&/^\d+[.)]$/.test(n.marker||'')?Number.parseInt(n.marker,10):1;
    prefix=(n.kind==='li'?leading:'')+num+type.slice(2)+' ';
  }else return false;
  const title=props.title??n.title,requestedStatus=props.status===undefined?n.status:props.status,
        status=requestedStatus==='story'?null:requestedStatus,
        checked=props.checked===undefined?n.checked:props.checked;
  const parts=[];
  if(checked!==null)parts.push(checked?'[x]':'[ ]');
  if(status!==null&&status!==undefined&&status!=='')parts.push('[status:'+status+']');
  parts.push(title);
  ls[n.start]=prefix+parts.join(' ');
  const result=ls.join('\n');
  if(scanMarkdown(result).roots.length!==1){
    toast('Pro Dokument ist genau eine H1 erforderlich. Knotentyp wurde nicht geändert.');
    return false;
  }
  d.content=result;
  return d;
}
async function patchNode(path,props){let n=flattened(currentModel).find(n=>n.path===path);if(!n)return;let d=lineEdit(n,props);if(d){await put('docs',d);render()}}
function editNode(path){
  const n=flattened(currentModel).find(item=>item.path===path);
  if(!n||n.kind==='virtual')return;
  const refs=[...n.title.matchAll(/\[\[([^\]#|]+)(?:#([^\]|]+))?(?:\|[^\]]+)?\]\]/g)];
  const previousType=nodeTypeValue(n),isKanbanTicket=view==='kanban';
  const typeOptions=NODE_TYPES.map(t=>`<option value="${t.value}" ${t.value===previousType?'selected':''}>${escapeHtml(t.label)}</option>`).join('');
  openModal(`<h2><label for="nodeTitle">${isKanbanTicket?'Ticket':'Knoten'} bearbeiten</label></h2><form id="nodeForm" class="node-form">
    <div class="field"><input id="nodeTitle" aria-label="Knoten bearbeiten: Titel" required value="${escapeHtml(n.title)}"></div>
    <div class="node-properties ${isKanbanTicket?'single':''}"><div class="field"><label for="nodeType">Knotentyp</label><select id="nodeType">${typeOptions}</select></div>
    ${isKanbanTicket?'':`<div class="field"><label for="nodeStatus">Status</label><select id="nodeStatus">${STATUS.map(st=>`<option value="${st}" ${st===(n.status||'story')?'selected':''}>${escapeHtml(statusLabel(st))}</option>`).join('')}</select></div>`}</div>
    <div class="field"><label>Aufgabenstatus (Checkbox)</label><div class="node-check-group"><label><input type="checkbox" id="nodeUseCheck" ${n.checked!==null?'checked':''}> Checkbox für diesen Knoten verwenden</label><label><input type="checkbox" id="nodeDone" ${n.checked===true?'checked':''} ${n.checked===null?'disabled':''}> Erledigt</label></div></div>
    <div class="field"><label for="nodeDescription">Beschreibung (Markdown)</label><textarea id="nodeDescription">${escapeHtml(n.description.join('\n').trim())}</textarea></div>
    ${refs.length?`<div class="field"><label>Dokumentenverknüpfungen</label>${refs.map((m,i)=>`<button type="button" class="btn" data-link="${i}" style="text-align:left">↗ ${escapeHtml(m[0])}</button>`).join('')}</div>`:''}
    ${formActions()}</form>`);
  $('#modal').classList.add('node-modal');
  wireCancel();
  $('#nodeUseCheck').onchange=()=>{$('#nodeDone').disabled=!$('#nodeUseCheck').checked};
  document.querySelectorAll('[data-link]').forEach(el=>el.onclick=()=>navigateLink(refs[Number(el.dataset.link)][1],refs[Number(el.dataset.link)][2]));
  $('#nodeForm').onsubmit=async e=>{
    e.preventDefault();
    const nextType=$('#nodeType').value;
    const d=lineEdit(n,{title:$('#nodeTitle').value.trim(),nodeType:nextType,
      status:isKanbanTicket?n.status:$('#nodeStatus').value||null,
      checked:$('#nodeUseCheck').checked?$('#nodeDone').checked:null});
    if(!d)return;
    const lines=d.content.split('\n'),scan=scanMarkdown(d.content),start=n.start+1;
    let end=start;
    while(end<lines.length&&!['heading','list'].includes(scan.items[end]?.kind))end++;
    const desc=$('#nodeDescription').value.trim();
    const markerLine=lines[n.start];
    const isList=!nextType.startsWith('h');
    const indent=isList?(markerLine.match(/^\s*/)?.[0]||'')+'  ':'';
    const replacement=desc?desc.split('\n').map(l=>l?indent+l:''):[];
    if(n.children.length&&replacement.length)replacement.push('');
    lines.splice(start,end-start,...replacement);
    d.content=lines.join('\n');
    await put('docs',{...d});
    // Keep the selection anchored to the edited line if its node type changes.
    if(view==='mindmap'){
      const updated=parseMarkdown(d.content,scanMarkdown(d.content));
      const edited=flattened(updated).find(item=>item.start===n.start&&item.kind!=='virtual');
      if(edited)mapSelectedPaths.set(d.id,edited.path);
      else mapSelectedPaths.delete(d.id);
    }
    closeModal();render();toast('Knoten gespeichert');
  };
}
function navigateLink(name,heading){let d=docs.find(x=>x.projectId===projectId&&x.name.toLowerCase()===name.toLowerCase());if(!d)return toast('Zieldokument nicht gefunden: '+name);docId=d.id;setView('mindmap');scopePath='0';closeModal();render();if(heading){let target=flattened(currentModel).find(n=>n.kind==='h'&&plain(n.title).toLowerCase()===heading.toLowerCase());if(target){let el=[...document.querySelectorAll('[data-node]')].find(x=>x.dataset.node===target.path);centerMapNode(target.path)}else toast('Überschrift nicht gefunden: '+heading)}}
function addNode(){let root=currentRoot();let options=flattened(root);openModal(`<h2><label for="nodeTitle">Knoten erstellen</label></h2><form id="addForm" class="node-form"><div class="field"><input id="nodeTitle" required placeholder="Neuer Gedanke"></div><div class="field"><label for="parentSelect">Übergeordneter Knoten</label><select id="parentSelect">${options.map(n=>`<option value="${n.path}">${escapeHtml(plain(n.title))}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="addStatus">${STATUS.map(s=>`<option value="${s}">${escapeHtml(statusLabel(s))}</option>`).join('')}</select></div>${formActions('Knoten hinzufügen')}</form>`);$('#modal').classList.add('node-modal');wireCancel();$('#addForm').onsubmit=async e=>{e.preventDefault();let parent=options.find(n=>n.path===$('#parentSelect').value),d=documentNow(),lines=d.content.split('\n');let indent=parent.kind==='li'?' '.repeat(parent.indent+2):'';let status=$('#addStatus').value;let line=indent+'- '+(status&&status!=='story'?'[status:'+status+'] ':'')+$('#nodeTitle').value.trim();let insertion=parent.kind==='h'?findHeadingEnd(lines,parent):findListEnd(lines,parent);lines.splice(insertion,0,line);d.content=lines.join('\n');await put('docs',d);closeModal();render();toast('Knoten hinzugefügt')}}
function findHeadingEnd(lines,n){let i=n.start+1;for(;i<lines.length;i++){let m=lines[i].match(/^ {0,3}(#{1,6})\s/);if(m&&m[1].length<=n.level)break}return i}function findListEnd(lines,n){let i=n.start+1;for(;i<lines.length;i++){let m=lines[i].match(/^(\s*)(?:[-+*]|\d+[.)])\s/);if(/^ {0,3}#{1,6}\s/.test(lines[i])||(m&&m[1].length<=n.indent))break}return i}
// ZIP stored-entry writer (no dependencies, works offline)
const enc=new TextEncoder(),dec=new TextDecoder();function crc32(data){let crc=-1;for(let b of data){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^-1)>>>0}
function makeZip(entries){let parts=[],central=[],offset=0;for(let [name,text] of entries){let nb=enc.encode(name),body=enc.encode(text),crc=crc32(body),head=new Uint8Array(30+nb.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,body.length,true);v.setUint32(22,body.length,true);v.setUint16(26,nb.length,true);head.set(nb,30);parts.push(head,body);let ch=new Uint8Array(46+nb.length),c=new DataView(ch.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,body.length,true);c.setUint32(24,body.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,offset,true);ch.set(nb,46);central.push(ch);offset+=head.length+body.length}let cdsize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,cdsize,true);e.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
async function readZip(buffer){let a=new Uint8Array(buffer),v=new DataView(buffer),pos=a.length-22;while(pos>=0&&v.getUint32(pos,true)!==0x06054b50)pos--;if(pos<0)throw Error('Ungültige ZIP-Datei');let count=v.getUint16(pos+10,true),at=v.getUint32(pos+16,true),out=[];for(let k=0;k<count;k++){if(v.getUint32(at,true)!==0x02014b50)throw Error('Ungültiger ZIP-Eintrag');let method=v.getUint16(at+10,true),size=v.getUint32(at+20,true),nl=v.getUint16(at+28,true),extra=v.getUint16(at+30,true),comment=v.getUint16(at+32,true),loc=v.getUint32(at+42,true),name=dec.decode(a.slice(at+46,at+46+nl)),start=loc+30+v.getUint16(loc+26,true)+v.getUint16(loc+28,true),bytes=a.slice(start,start+size);if(method===8){if(typeof DecompressionStream==='undefined')throw Error('Dieser Browser unterstützt komprimierte ZIP-Dateien nicht');let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}else if(method!==0)throw Error('Nicht unterstützte ZIP-Komprimierung');if(name&&!name.endsWith('/'))out.push([name,dec.decode(bytes)]);at+=46+nl+extra+comment}return out}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportProject(){let p=project();if(!p)return;let items=docs.filter(d=>d.projectId===p.id),entries=[['mindstorm-project.json',JSON.stringify({format:'mindstorm',version:3,name:p.name,statusSettings:statusSettingsFor(p),documents:items.map(d=>({name:d.name,file:safeName(d.name)+'.md',mapPositions:d.mapPositions||{},mapCollapsedPaths:d.mapCollapsedPaths||[]}))},null,2)],...items.map(d=>[safeName(d.name)+'.md',d.content])];download(makeZip(entries),safeName(p.name)+'.zip');toast('Projekt exportiert')}
async function importProject(file){try{let entries=await readZip(await file.arrayBuffer()),meta=entries.find(x=>x[0]==='mindstorm-project.json'),metadata=meta?JSON.parse(meta[1]):null,pname=metadata?.name||file.name.replace(/\.zip$/i,'');let mapping=metadata?metadata.documents:entries.filter(x=>x[0].endsWith('.md')).map(x=>({name:x[0].split('/').pop().replace(/\.md$/i,''),file:x[0]}));if(!mapping.length)throw Error('Keine Markdown-Dateien gefunden');let p={id:uid(),name:pname+' (Import)',created:Date.now(),statusSettings:statusSettingsFor({statusSettings:metadata?.statusSettings})};await put('projects',p);for(let item of mapping){let found=entries.find(x=>x[0]===item.file);if(found)await put('docs',{id:uid(),projectId:p.id,name:item.name,content:found[1],mapPositions:item.mapPositions||{},mapCollapsedPaths:item.mapCollapsedPaths||[]})}await refresh();selectProject(p.id);toast('Projekt importiert')}catch(e){toast('Import fehlgeschlagen: '+e.message)}}
$('#addProject').onclick=()=>{setMobileMenu(false);createProject()};$('#addDocument').onclick=()=>{setMobileMenu(false);createDocument()};$('#renameDoc').onclick=renameDocument;$('#undoAction').onclick=()=>changeHistory('undo');$('#redoAction').onclick=()=>changeHistory('redo');$('#exportZip').onclick=()=>{setMobileMenu(false);exportProject()};$('#importZip').onclick=()=>{setMobileMenu(false);$('#fileImport').click()};$('#fileImport').onchange=async e=>{if(e.target.files[0])await importProject(e.target.files[0]);e.target.value=''};document.querySelectorAll('[data-view]').forEach(e=>e.onclick=async()=>{if(view==='markdown')await saveSource();setView(e.dataset.view);render()});$('#menuToggle').onclick=()=>setMobileMenu(!$('.app').classList.contains('menu-open'));$('#sidebarScrim').onclick=()=>setMobileMenu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.app').classList.contains('menu-open'))setMobileMenu(false)});window.addEventListener('resize',()=>setMobileMenu($('.app').classList.contains('menu-open')));
document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.altKey||$('#modalBack')&&!$('#modalBack').classList.contains('hidden'))return;
  const inInput=!!e.target.closest('textarea,input,select,[contenteditable="true"]');

    if(key==='z'){e.preventDefault();changeHistory(e.shiftKey?'redo':'undo');return}

  }
});
