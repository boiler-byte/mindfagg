<script>
'use strict';
const $=s=>document.querySelector(s), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS=['story','todo','doing','review','done'];const STATUS_LABEL={story:'Story',todo:'To Do',doing:'In Progress',review:'Review',done:'Done'};
const SAMPLE=`# [ ] Mein Projekt\nEine zentrale Mindmap für Ideen, Aufgaben und Fortschritt.\n\n## [status:done] Planung\nDie Anforderungen und das Konzept werden vorbereitet.\n\n- [x] Ziele definieren\n- [x] Anforderungen sammeln\n\n## [status:doing] Entwicklung\nDie App wird Schritt für Schritt umgesetzt.\n\n- [x] Markdown-Parser\n- [ ] [status:doing] Mindmap-Ansicht\n- [ ] [status:todo] Kanban-Ansicht\n- [ ] [status:review] Dokumentation\n\n## [status:story] Ideen\nHier ist Platz für neue Gedanken.\n\n- Später umsetzen\n- [[Planung]]\n`;
let db,projects=[],docs=[],projectId=null,docId=null,view='mindmap',scopePath='0',currentModel=null,saveTimer;
const VIEWS=['mindmap','kanban','markdown'];
function setView(next){if(!VIEWS.includes(next))return;view=next;try{localStorage.setItem('msView',next)}catch(e){console.warn('Ansicht konnte nicht gespeichert werden:',e)}}
function setMobileMenu(open){const mobile=window.matchMedia('(max-width:850px)').matches;const active=mobile&&Boolean(open);$('.app').classList.toggle('menu-open',active);$('#mainSidebar').inert=mobile&&!active;$('#menuToggle').setAttribute('aria-expanded',String(active));$('#menuToggle').setAttribute('aria-label',active?'Hauptmenü schließen':'Hauptmenü öffnen')}

const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function all(store){return req(tx(store).getAll())}
async function put(store,value){return req(tx(store,'readwrite').put(value))}
async function del(store,key){return req(tx(store,'readwrite').delete(key))}
async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('mindstorm-db',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('docs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await refresh();if(!projects.length){let p={id:uid(),name:'Mein Workspace',created:Date.now()};await put('projects',p);await put('docs',{id:uid(),projectId:p.id,name:'Projekt',content:SAMPLE});}await refresh();try{const lastView=localStorage.getItem('msView');if(VIEWS.includes(lastView))view=lastView}catch(e){console.warn('Letzte Ansicht konnte nicht geladen werden:',e)}projectId=localStorage.getItem('msProject');if(!projects.some(p=>p.id===projectId))projectId=projects[0].id;selectProject(projectId)}
async function refresh(){projects=await all('projects');docs=await all('docs')}
function project(){return projects.find(p=>p.id===projectId)}function documentNow(){return docs.find(d=>d.id===docId)}
function selectProject(id){setMobileMenu(false);projectId=id;localStorage.setItem('msProject',id);let pd=docs.filter(d=>d.projectId===id);let old=docId;docId=pd.some(d=>d.id===old)?old:pd[0]?.id||null;scopePath='0';render()}
function selectDocument(id){setMobileMenu(false);docId=id;scopePath='0';render()}

// A shared scanner keeps root validation, highlighting and the tree parser consistent.
function scanMarkdown(source){
  const text=String(source).replace(/\r\n?/g,'\n'),ls=text.split('\n'),items=[],h1=[];let fence=null;
  for(let i=0;i<ls.length;i++){
    const raw=ls[i];let item={raw,line:i,kind:'description'};
    if(fence){
      const closing=raw.match(/^\s*(`{3,}|~{3,})[ \t]*$/);
      if(closing&&closing[1][0]===fence.char&&closing[1].length>=fence.size){item.kind='fence';fence=null}
      else item.kind='code';
      items.push(item);continue;
    }
    const opener=raw.match(/^\s*(`{3,}|~{3,})(.*)$/);
    if(opener){item.kind='fence';fence={char:opener[1][0],size:opener[1].length};items.push(item);continue}
    const thematic=/^ {0,3}(?:(?:\*[ \t]*){3,}|(?:-[ \t]*){3,}|(?:_[ \t]*){3,})$/.test(raw);
    const heading=raw.match(/^ {0,3}(#{1,6})(?:[ \t]+(.*)|[ \t]*)$/);
    const list=thematic?null:raw.match(/^([ \t]*)(?:([-+*])|(\d+[.)]))[ \t]+(.+)$/);
    if(heading){item.kind='heading';item.level=heading[1].length;item.prefix=raw.slice(0,raw.indexOf(heading[1])+heading[1].length);item.title=(heading[2]||'').replace(/[ \t]+#+[ \t]*$/,'').trim();if(item.level===1)h1.push(i)}
    else if(list){item.kind='list';item.indent=list[1].replace(/\t/g,'    ').length;item.prefix=raw.slice(0,raw.length-list[4].length);item.title=list[4]}
    else if(/^\s*>/.test(raw))item.kind='quote';
    else if(/^\s*\|/.test(raw))item.kind='table';
    else if(/^\s*<!--/.test(raw))item.kind='comment';
    items.push(item);
  }
  const offsets=[];let offset=0;for(const line of ls){offsets.push(offset);offset+=line.length+1}
  return {lines:ls,items,roots:h1,valid:h1.length===1,offsets};
}
function validationMessage(scan){
  if(scan.roots.length===1)return '1 / 1 H1 · gültiger Root';
  if(!scan.roots.length)return 'Keine H1 · # Titel ergänzen';
  return scan.roots.length+' H1 gefunden · nur eine erlaubt (Zeilen '+scan.roots.slice(1).map(i=>i+1).join(', ')+')';
}
function nodeText(raw){
  let s=raw.trim(),checked=null,status=null;
  for(let i=0;i<2;i++){
    let box=s.match(/^\[([ xX])\](?:\s+|$)/);
    if(box&&checked===null){checked=box[1].toLowerCase()==='x';s=s.slice(box[0].length);continue}
    let st=s.match(/^\[status:([a-z-]+)\](?:\s+|$)/i);
    if(st&&status===null){status=st[1].toLowerCase();s=s.slice(st[0].length);continue}
    break;
  }
  return {title:s.trim(),checked,status};
}


function parseMarkdown(src,analysis){
  const scan=analysis||scanMarkdown(src),ls=scan.lines;
  const root={title:'Dokument',children:[],depth:0,path:'0',start:-1,end:ls.length,kind:'virtual',checked:null,status:null,description:[]};
  let headings=[],listStack=[],last=root;
  function addNode(item){
    let parent;
    if(item.kind==='heading'){
      while(headings.length&&headings[headings.length-1].level>=item.level)headings.pop();
      parent=headings.length?headings[headings.length-1].node:root;
      listStack=[];
    }else{
      while(listStack.length&&listStack[listStack.length-1].indent>=item.indent)listStack.pop();
      parent=listStack.length?listStack[listStack.length-1].node:(headings.length?headings[headings.length-1].node:root);
    }
    const n={...nodeText(item.title),children:[],parent,kind:item.kind==='heading'?'h':'li',level:item.level||0,indent:item.indent||0,start:item.line,end:ls.length,description:[]};
    n.path=parent.path+'.'+parent.children.length;
    parent.children.push(n);
    if(item.kind==='heading')headings.push({level:item.level,node:n});
    else listStack.push({indent:item.indent,node:n});
    last=n;
  }
  for(const item of scan.items){
    if(item.kind==='heading'||item.kind==='list')addNode(item);
    else last.description.push(item.raw);
  }
  const nodeLines=scan.items.filter(i=>i.kind==='heading'||i.kind==='list').map(i=>i.line);
  function close(n){
    for(const c of n.children)close(c);
    n.end=nodeLines.find(i=>i>n.start)??ls.length;
  }
  close(root);
  function forceProgress(n){
    n.children.forEach(forceProgress);
    n.progress=n.checked===true?100:n.children.length?n.children.reduce((s,c)=>s+c.progress,0)/n.children.length:0;
  }
  forceProgress(root);return root;
}




function flattened(root){let out=[];function rec(n){out.push(n);n.children.forEach(rec)}rec(root);return out}function actualRoot(m){return m.children.find(n=>n.kind==='h'&&n.level===1)||m.children[0]||m}
function currentRoot(){return actualRoot(currentModel)}function getScope(){return flattened(currentModel).find(n=>n.path===scopePath)||currentRoot()}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast._timer);toast._timer=setTimeout(()=>e.classList.add('hidden'),2600)}

function render(){
  let p=project(),d=documentNow();
  $('#projectLabel').innerHTML=`<select id="projectSelect" aria-label="Projekt auswählen">${projects.map(item=>`<option value="${item.id}" ${item.id===projectId?'selected':''}>${escapeHtml(item.name)}</option>`).join('')}</select>`;
  $('#projectSelect').onchange=async e=>{await flushSource();selectProject(e.target.value)};
  $('#docList').innerHTML=docs.filter(x=>x.projectId===projectId).map(x=>`<button class="navitem ${x.id===docId?'active':''}" data-doc="${x.id}"><span class="sym">▤</span><span>${escapeHtml(x.name)}</span></button>`).join('');
  document.querySelectorAll('[data-doc]').forEach(e=>e.onclick=async()=>{await flushSource();selectDocument(e.dataset.doc)});
  $('#breadcrumb').textContent=`${p?.name||'Workspace'} / ${d?.name||'Kein Dokument'}`;
  $('#docTitle').textContent=d?.name||'Kein Dokument';
  $('#renameDoc').disabled=!d;$('#newNode').disabled=!d;
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.view===view));
  if(editorResizeObserver){editorResizeObserver.disconnect();editorResizeObserver=null}
  if(!d){$('#surface').innerHTML='<div class="empty">Lege ein Dokument an, um zu beginnen.</div>';return}
  const inspection=scanMarkdown(d.content);
  currentModel=parseMarkdown(d.content,inspection);
  if(!flattened(currentModel).some(n=>n.path===scopePath))scopePath=currentRoot().path;
  if(view==='markdown'){renderEditor();return}
  if(!inspection.valid){
    $('#surface').innerHTML=`<div class="source-invalid"><div class="warningicon">!</div><h2>Dokumentstruktur prüfen</h2><p>${escapeHtml(validationMessage(inspection))}. Eine Mindmap benötigt genau eine Überschrift der Ebene 1 (<code># Titel</code>). Der Markdown-Text ist weiterhin gespeichert.</p><button class="btn primary" id="fixRoot">Im Markdown-Editor korrigieren</button></div>`;
    $('#fixRoot').onclick=()=>{setView('markdown');render();focusRootProblem()};return;
  }
  if(view==='mindmap')renderMindmap();
  if(view==='kanban')renderKanban();
}

function plain(s){return s.replace(/!?\[\[([^\]|#]+)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g,(_,d,h,a)=>a||h||d).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[*_`~]/g,'').trim()}
function treeHtml(n,root=false){return `<div class="treebranch"><button class="node ${root?'treeroot':''}" data-node="${escapeHtml(n.path)}"><span class="dot" style="background:${n.checked===true?'#70d4b3':n.status==='doing'?'#eabd72':'#a59aff'}"></span><span class="nodeinner"><span class="nodetitle">${escapeHtml(plain(n.title))}</span>${(n.checked!==null||n.children.length)?`<span class="nodefoot">${n.checked===true?'✓ ':''}${Math.round(n.progress)}% <span class="bar"><i style="width:${n.progress}%"></i></span></span>`:''}</span></button>${n.children.length?`<div class="children">${n.children.map(c=>treeHtml(c)).join('')}</div>`:''}</div>`}
function renderMindmap(){let root=currentRoot();$('#surface').innerHTML=`<div class="surfacehead"><span class="pill">✳ &nbsp; Mindmap · ${flattened(root).length} Knoten</span><span class="subtle">Klicken zum Bearbeiten · horizontal scrollen</span></div><div class="mindcanvas"><div class="mindtree">${treeHtml(root,true)}</div></div>`;document.querySelectorAll('[data-node]').forEach(e=>e.onclick=()=>editNode(e.dataset.node))}
function renderKanban(){let root=currentRoot(),all=flattened(root);let selected=all.find(n=>n.path===scopePath)||root;scopePath=selected.path;$('#surface').innerHTML=`<div class="surfacehead"><span class="pill">▥ &nbsp; Kanban · direkte Unterknoten</span><select class="scope" id="scopeSelect">${all.map(n=>`<option value="${n.path}" ${n.path===scopePath?'selected':''}>${escapeHtml(plain(n.title))}</option>`).join('')}</select></div><div class="kanban">${STATUS.map(st=>{let ns=selected.children.filter(n=>(n.status||'story')===st);return `<div class="lane"><div class="laneheading"><span>${STATUS_LABEL[st]}</span><span class="count">${ns.length}</span></div>${ns.map(n=>`<div class="ticket" data-open="${n.path}"><b>${escapeHtml(plain(n.title))}</b><small>${n.children.length?'▦ '+n.children.length+' Unterknoten · ':''}${Math.round(n.progress)}% Fortschritt</small><select data-status-node="${n.path}">${STATUS.map(s=>`<option value="${s}" ${s===(n.status||'story')?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select>${n.children.length?`<button class="btn" data-scope="${n.path}">Unterknoten ansehen →</button>`:''}</div>`).join('')}</div>`}).join('')}</div>`;$('#scopeSelect').onchange=e=>{scopePath=e.target.value;renderKanban()};document.querySelectorAll('[data-open]').forEach(e=>e.onclick=ev=>{if(ev.target.closest('select,[data-scope]'))return;editNode(e.dataset.open)});document.querySelectorAll('[data-scope]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();scopePath=e.dataset.scope;renderKanban()});document.querySelectorAll('[data-status-node]').forEach(e=>e.onchange=async ev=>{ev.stopPropagation();await patchNode(e.dataset.statusNode,{status:e.value})})}

const SYN_TOKENS=/(\[\[([^\]]+)\]\]|\[[^\]]+\]\([^)]+\)|`[^`]*`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_)/g;
function paintInline(raw){
  let out='',pos=0;
  for(const match of raw.matchAll(SYN_TOKENS)){
    out+=escapeHtml(raw.slice(pos,match.index));
    let word=match[0],type=/^\[\[|^\[[^\]]+\]\(/.test(word)?'syn-link':word.startsWith('`')?'syn-code':word.startsWith('**')||word.startsWith('__')?'syn-strong':'syn-em';
    out+=`<span class="${type}">${escapeHtml(word)}</span>`;pos=match.index+word.length;
  }
  return out+escapeHtml(raw.slice(pos));
}
function paintNodeText(value){
  let rest=value,html='';
  for(let i=0;i<2;i++){
    const space=rest.match(/^\s+/);
    if(space){html+=escapeHtml(space[0]);rest=rest.slice(space[0].length)}
    const cb=rest.match(/^\[([ xX])\](?=\s|$)/);
    const status=rest.match(/^\[status:([a-z-]+)\](?=\s|$)/i);
    if(cb){html+=`<span class="${cb[1].toLowerCase()==='x'?'syn-checkbox-done':'syn-checkbox'}">${escapeHtml(cb[0])}</span>`;rest=rest.slice(cb[0].length);continue}
    if(status){let key=status[1].toLowerCase(),cls=['done','doing','todo','review'].includes(key)?' syn-status-'+key:'';html+=`<span class="syn-status${cls}">${escapeHtml(status[0])}</span>`;rest=rest.slice(status[0].length);continue}
    break;
  }
  return html+paintInline(rest);
}
function paintLine(item,scan){
  const raw=item.raw;
  if(item.kind==='heading'){
    const m=raw.match(/^( {0,3}#{1,6})(.*)$/);
    return `<span class="syn-heading">${escapeHtml(m[1])}</span><span class="syn-heading-title">${paintNodeText(m[2])}</span>`;
  }
  if(item.kind==='list')return `<span class="syn-bullet">${escapeHtml(item.prefix)}</span>${paintNodeText(raw.slice(item.prefix.length))}`;
  if(item.kind==='fence')return `<span class="syn-fence">${escapeHtml(raw)}</span>`;
  if(item.kind==='code')return `<span class="syn-codecontent">${escapeHtml(raw)}</span>`;
  if(item.kind==='quote')return `<span class="syn-quote">${paintInline(raw)}</span>`;
  if(item.kind==='table')return `<span class="syn-table">${paintInline(raw)}</span>`;
  if(item.kind==='comment')return `<span class="syn-comment">${escapeHtml(raw)}</span>`;
  return paintInline(raw);
}
let editorScan=null,editorDocId=null,editorResizeObserver=null,miniFrame=0,miniGeometry=null;
function refreshCodeVisuals(){
  const source=$('#source');if(!source)return;
  editorScan=scanMarkdown(source.value);
  const invalid=new Set(editorScan.roots.slice(1));
  $('#syntax').innerHTML=editorScan.items.map((it,i)=>`<span class="syn-line ${it.kind==='heading'&&it.level===1?'syn-root':''} ${invalid.has(i)?'syn-invalid':''}">${paintLine(it,editorScan)}</span>`).join('\n')+'\n';
  $('#lineNumbers').innerHTML=editorScan.items.map((it,i)=>`<span class="gline ${it.kind==='heading'&&it.level===1?'h1':''} ${invalid.has(i)?'error':''}">${i+1}</span>`).join('');
  const state=$('#rootState');state.classList.toggle('invalid',!editorScan.valid);state.textContent=(editorScan.valid?'✓ ':'⚠ ')+validationMessage(editorScan);
  state.setAttribute('aria-label',editorScan.valid?'Dokumentstruktur gültig':validationMessage(editorScan)+'; klicken zum Fehler');
  state.title=editorScan.valid?'Genau eine Root-Überschrift vorhanden':'Zum Fehler im Markdown springen';
  syncCodeScroll();
}
function syncCodeScroll(){
  const source=$('#source');if(!source)return;
  $('#syntax').style.transform=`translate(${-source.scrollLeft}px, ${-source.scrollTop}px)`;
  $('#lineNumbers').style.transform=`translateY(${-source.scrollTop}px)`;
  if(!miniFrame)miniFrame=requestAnimationFrame(()=>{miniFrame=0;drawMinimap();drawEditorInteractions();positionCompletionPopup()});
}
function drawMinimap(){
  const source=$('#source'),map=$('#minimap'),canvas=$('#miniCanvas'),target=$('#miniViewport');
  if(!source||!map||!canvas||!editorScan||!target)return;
  const width=map.clientWidth,height=map.clientHeight;if(width<1||height<1)return;
  const scale=Math.min(window.devicePixelRatio||1,2),wpx=Math.round(width*scale),hpx=Math.round(height*scale);
  if(canvas.width!==wpx||canvas.height!==hpx){canvas.width=wpx;canvas.height=hpx}
  const ctx=canvas.getContext('2d');if(!ctx)return;
  ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,width,height);
  const scrollHeight=Math.max(source.scrollHeight,source.clientHeight),maxScroll=Math.max(0,scrollHeight-source.clientHeight);
  const ratio=maxScroll?source.scrollTop/maxScroll:0;
  const virtualHeight=Math.max(height,editorScan.lines.length*5.3+19);
  // The overview travels at a reduced rate as the code scrolls: parallax.
  const mapOffset=ratio*Math.max(0,virtualHeight-height);
  const lineHeight=parseFloat(getComputedStyle(source).lineHeight)||23;
  const topPad=parseFloat(getComputedStyle(source).paddingTop)||17;
  const lineSpacing=lineHeight*virtualHeight/scrollHeight;
  const first=Math.max(0,Math.floor((mapOffset-topPad*virtualHeight/scrollHeight)/lineSpacing)-2);
  const last=Math.min(editorScan.items.length,Math.ceil((mapOffset+height)/lineSpacing)+2);
  for(let i=first;i<last;i++){
    const it=editorScan.items[i],raw=it.raw;
    if(!raw.trim())continue;
    const y=((topPad+i*lineHeight)*virtualHeight/scrollHeight)-mapOffset;
    if(y< -8||y>height+8)continue;
    const leading=(raw.match(/^\s*/)||[''])[0].replace(/\t/g,'  ').length;
    const x=4+Math.min(leading,36)*.83;
    const len=Math.max(2,Math.min(width-x-5,raw.trimEnd().length*.95));
    if(len<=0)continue;
    const color=it.kind==='heading'?'#aa99f5':it.kind==='list'?'#63bbc4':it.kind==='fence'?'#9c78bf':it.kind==='code'?'#61748e':it.kind==='quote'?'#75aa92':it.kind==='table'?'#829ec5':'#647891';
    ctx.fillStyle=color;ctx.globalAlpha=it.kind==='description'?.55:.82;
    ctx.fillRect(x,y,len,Math.min(3.2,Math.max(1.6,lineSpacing*.5)));
    if(it.kind==='heading'||it.kind==='list'){
      const status=raw.match(/\[status:(done|doing|todo|review|story)\]/i);
      const check=raw.match(/\[[ xX]\]/);
      if(status||check){ctx.fillStyle=status?.[1]==='done'||check?.[0].toLowerCase()==='[x]'?'#6dd7ad':status?.[1]==='doing'?'#f0ba79':'#d6acfb';ctx.globalAlpha=1;ctx.fillRect(Math.min(width-7,x+len*.38),y,Math.min(13,len*.25),Math.min(3.2,Math.max(1.6,lineSpacing*.5)))}

function createProject(){openModal(`<h2>Neues Projekt</h2><p>Projekte und Dokumente werden lokal in deinem Browser gespeichert.</p><form id="projectForm"><div class="field"><label>Projektname</label><input id="projectName" maxlength="90" required placeholder="Mein neues Projekt" autofocus></div>${formActions('Projekt erstellen')}</form>`);wireCancel();$('#projectForm').onsubmit=async e=>{e.preventDefault();let p={id:uid(),name:$('#projectName').value.trim(),created:Date.now()};if(!p.name)return;await put('projects',p);await refresh();selectProject(p.id);closeModal();toast('Projekt erstellt')}}
function createDocument(){if(!projectId)return createProject();openModal(`<h2>Neues Dokument</h2><p>Jedes Dokument besitzt einen eindeutigen Namen innerhalb des Projekts.</p><form id="docForm"><div class="field"><label>Dokumentname</label><input id="newDocName" required maxlength="100" placeholder="Planung"></div>${formActions('Dokument erstellen')}</form>`);wireCancel();$('#docForm').onsubmit=async e=>{e.preventDefault();let name=$('#newDocName').value.trim().replace(/\.md$/i,'');if(!name||docs.some(d=>d.projectId===projectId&&d.name.toLowerCase()===name.toLowerCase()))return toast('Dokumentname existiert bereits');let d={id:uid(),projectId,name,content:'# '+name+'\n'};await put('docs',d);await refresh();selectDocument(d.id);closeModal();toast('Dokument erstellt')}}
function renameDocument(){let d=documentNow();if(!d)return;openModal(`<h2>Dokument umbenennen</h2><form id="renameForm"><div class="field"><label>Name</label><input id="renameValue" required value="${escapeHtml(d.name)}"></div>${formActions()}</form>`);wireCancel();$('#renameForm').onsubmit=async e=>{e.preventDefault();let name=$('#renameValue').value.trim().replace(/\.md$/i,'');if(!name||docs.some(x=>x.projectId===projectId&&x.id!==d.id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Dokumentname bereits vergeben');d.name=name;await put('docs',d);closeModal();render()}}
function lineEdit(n,props){let d=documentNow(),ls=d.content.replace(/\r\n?/g,'\n').split('\n'),line=ls[n.start];if(line===undefined)return false;let prefix=n.kind==='h'?line.match(/^\s*#{1,6}\s*/)?.[0]:line.match(/^\s*(?:[-+*]|\d+[.)])\s+/)?.[0];if(!prefix)return false;let title=props.title??n.title,status=props.status===undefined?n.status:props.status,checked=props.checked===undefined?n.checked:props.checked;let parts=[];if(checked!==null)parts.push(checked?'[x]':'[ ]');if(status&&status!=='story')parts.push('[status:'+status+']');parts.push(title);ls[n.start]=prefix+parts.join(' ');d.content=ls.join('\n');return d}
async function patchNode(path,props){let n=flattened(currentModel).find(n=>n.path===path);if(!n)return;let d=lineEdit(n,props);if(d){await put('docs',d);render()}}
function editNode(path){let n=flattened(currentModel).find(n=>n.path===path);if(!n||n.kind==='virtual')return;let refs=[...n.title.matchAll(/\[\[([^\]#|]+)(?:#([^\]|]+))?(?:\|[^\]]+)?\]\]/g)];openModal(`<h2>Knoten bearbeiten</h2><p>Änderungen werden direkt in der Markdown-Datei gespeichert.</p><form id="nodeForm"><div class="field"><label>Titel (Markdown erlaubt)</label><input id="nodeTitle" required value="${escapeHtml(n.title)}"></div><div class="field"><label>Status</label><select id="nodeStatus">${STATUS.map(s=>`<option value="${s}" ${s===(n.status||'story')?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div><div class="field"><label>Aufgabenstatus (Checkbox)</label><div class="node-check-group"><label><input type="checkbox" id="nodeUseCheck" ${n.checked!==null?'checked':''}> Checkbox für diesen Knoten verwenden</label><label><input type="checkbox" id="nodeDone" ${n.checked===true?'checked':''} ${n.checked===null?'disabled':''}> Erledigt</label></div></div><div class="field"><label>Beschreibung (Markdown)</label><textarea id="nodeDescription">${escapeHtml(n.description.join('\n').trim())}</textarea></div><div class="subtle">Berechneter Fortschritt: ${Math.round(n.progress)} % · ${n.children.length} direkte Unterknoten</div>${refs.length?`<div class="field"><label>Dokumentenverknüpfungen</label>${refs.map((m,i)=>`<button type="button" class="btn" data-link="${i}" style="text-align:left">↗ ${escapeHtml(m[0])}</button>`).join('')}</div>`:''}${formActions()}</form>`);wireCancel();$('#nodeUseCheck').onchange=()=>{$('#nodeDone').disabled=!$('#nodeUseCheck').checked};document.querySelectorAll('[data-link]').forEach(el=>el.onclick=()=>navigateLink(refs[Number(el.dataset.link)][1],refs[Number(el.dataset.link)][2]));$('#nodeForm').onsubmit=async e=>{e.preventDefault();let d=lineEdit(n,{title:$('#nodeTitle').value.trim(),status:$('#nodeStatus').value,checked:$('#nodeUseCheck').checked?$('#nodeDone').checked:null});if(!d)return;let lines=d.content.split('\n');let start=n.start+1;let end=start;while(end<lines.length&&!(/^( {0,3}#{1,6}\s|\s*(?:[-+*]|\d+[.)])\s)/.test(lines[end])))end++;let desc=$('#nodeDescription').value.trim();let oldSegment=lines.slice(start,end);let indent=n.kind==='li'?' '.repeat(n.indent+2):'';let replacement=desc?desc.split('\n').map(l=>l?indent+l:''):[];if(n.children.length){ // preserve children; only replace description before first child
  lines.splice(start,end-start,...replacement,...(replacement.length?['']:[]));
}else{lines.splice(start,end-start,...replacement)}
d.content=lines.join('\n');await put('docs',d);closeModal();render();toast('Knoten gespeichert')}}
function navigateLink(name,heading){let d=docs.find(x=>x.projectId===projectId&&x.name.toLowerCase()===name.toLowerCase());if(!d)return toast('Zieldokument nicht gefunden: '+name);docId=d.id;setView('mindmap');scopePath='0';closeModal();render();if(heading){let target=flattened(currentModel).find(n=>n.kind==='h'&&plain(n.title).toLowerCase()===heading.toLowerCase());if(target){let el=[...document.querySelectorAll('[data-node]')].find(x=>x.dataset.node===target.path);el?.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});if(el)el.classList.add('selected')}else toast('Überschrift nicht gefunden: '+heading)}}
function addNode(){let root=currentRoot();let options=flattened(root);openModal(`<h2>Neuer Knoten</h2><p>Füge einen Listenknoten unter einer vorhandenen Überschrift oder Liste hinzu.</p><form id="addForm"><div class="field"><label>Übergeordneter Knoten</label><select id="parentSelect">${options.map(n=>`<option value="${n.path}">${escapeHtml(plain(n.title))}</option>`).join('')}</select></div><div class="field"><label>Titel</label><input id="addTitle" required placeholder="Neuer Gedanke"></div><div class="field"><label>Status</label><select id="addStatus">${STATUS.map(s=>`<option value="${s}">${STATUS_LABEL[s]}</option>`).join('')}</select></div>${formActions('Knoten hinzufügen')}</form>`);wireCancel();$('#addForm').onsubmit=async e=>{e.preventDefault();let parent=options.find(n=>n.path===$('#parentSelect').value),d=documentNow(),lines=d.content.split('\n');let indent=parent.kind==='li'?' '.repeat(parent.indent+2):'';let status=$('#addStatus').value;let line=indent+'- '+(status==='story'?'':'[status:'+status+'] ')+$('#addTitle').value.trim();let insertion=parent.kind==='h'?findHeadingEnd(lines,parent):findListEnd(lines,parent);lines.splice(insertion,0,line);d.content=lines.join('\n');await put('docs',d);closeModal();render();toast('Knoten hinzugefügt')}}
function findHeadingEnd(lines,n){let i=n.start+1;for(;i<lines.length;i++){let m=lines[i].match(/^ {0,3}(#{1,6})\s/);if(m&&m[1].length<=n.level)break}return i}function findListEnd(lines,n){let i=n.start+1;for(;i<lines.length;i++){let m=lines[i].match(/^(\s*)(?:[-+*]|\d+[.)])\s/);if(/^ {0,3}#{1,6}\s/.test(lines[i])||(m&&m[1].length<=n.indent))break}return i}
// ZIP stored-entry writer (no dependencies, works offline)
const enc=new TextEncoder(),dec=new TextDecoder();function crc32(data){let crc=-1;for(let b of data){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^-1)>>>0}
function makeZip(entries){let parts=[],central=[],offset=0;for(let [name,text] of entries){let nb=enc.encode(name),body=enc.encode(text),crc=crc32(body),head=new Uint8Array(30+nb.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,body.length,true);v.setUint32(22,body.length,true);v.setUint16(26,nb.length,true);head.set(nb,30);parts.push(head,body);let ch=new Uint8Array(46+nb.length),c=new DataView(ch.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,body.length,true);c.setUint32(24,body.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,offset,true);ch.set(nb,46);central.push(ch);offset+=head.length+body.length}let cdsize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,cdsize,true);e.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
async function readZip(buffer){let a=new Uint8Array(buffer),v=new DataView(buffer),pos=a.length-22;while(pos>=0&&v.getUint32(pos,true)!==0x06054b50)pos--;if(pos<0)throw Error('Ungültige ZIP-Datei');let count=v.getUint16(pos+10,true),at=v.getUint32(pos+16,true),out=[];for(let k=0;k<count;k++){if(v.getUint32(at,true)!==0x02014b50)throw Error('Ungültiger ZIP-Eintrag');let method=v.getUint16(at+10,true),size=v.getUint32(at+20,true),nl=v.getUint16(at+28,true),extra=v.getUint16(at+30,true),comment=v.getUint16(at+32,true),loc=v.getUint32(at+42,true),name=dec.decode(a.slice(at+46,at+46+nl)),start=loc+30+v.getUint16(loc+26,true)+v.getUint16(loc+28,true),bytes=a.slice(start,start+size);if(method===8){if(typeof DecompressionStream==='undefined')throw Error('Dieser Browser unterstützt komprimierte ZIP-Dateien nicht');let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}else if(method!==0)throw Error('Nicht unterstützte ZIP-Komprimierung');if(name&&!name.endsWith('/'))out.push([name,dec.decode(bytes)]);at+=46+nl+extra+comment}return out}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportProject(){let p=project();if(!p)return;let items=docs.filter(d=>d.projectId===p.id),entries=[['mindstorm-project.json',JSON.stringify({format:'mindstorm',version:1,name:p.name,documents:items.map(d=>({name:d.name,file:safeName(d.name)+'.md'}))},null,2)],...items.map(d=>[safeName(d.name)+'.md',d.content])];download(makeZip(entries),safeName(p.name)+'.zip');toast('Projekt exportiert')}
async function importProject(file){try{let entries=await readZip(await file.arrayBuffer()),meta=entries.find(x=>x[0]==='mindstorm-project.json'),pname=meta?JSON.parse(meta[1]).name:file.name.replace(/\.zip$/i,'');let mapping=meta?JSON.parse(meta[1]).documents:entries.filter(x=>x[0].endsWith('.md')).map(x=>({name:x[0].split('/').pop().replace(/\.md$/i,''),file:x[0]}));if(!mapping.length)throw Error('Keine Markdown-Dateien gefunden');let p={id:uid(),name:pname+' (Import)',created:Date.now()};await put('projects',p);for(let item of mapping){let found=entries.find(x=>x[0]===item.file);if(found)await put('docs',{id:uid(),projectId:p.id,name:item.name,content:found[1]})}await refresh();selectProject(p.id);toast('Projekt importiert')}catch(e){toast('Import fehlgeschlagen: '+e.message)}}
$('#addProject').onclick=()=>{setMobileMenu(false);createProject()};$('#addDocument').onclick=()=>{setMobileMenu(false);createDocument()};$('#renameDoc').onclick=renameDocument;$('#newNode').onclick=addNode;$('#exportZip').onclick=()=>{setMobileMenu(false);exportProject()};$('#importZip').onclick=()=>{setMobileMenu(false);$('#fileImport').click()};$('#fileImport').onchange=async e=>{if(e.target.files[0])await importProject(e.target.files[0]);e.target.value=''};document.querySelectorAll('[data-view]').forEach(e=>e.onclick=async()=>{if(view==='markdown')await saveSource();setView(e.dataset.view);render()});$('#menuToggle').onclick=()=>setMobileMenu(!$('.app').classList.contains('menu-open'));$('#sidebarScrim').onclick=()=>setMobileMenu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.app').classList.contains('menu-open'))setMobileMenu(false)});window.addEventListener('resize',()=>setMobileMenu($('.app').classList.contains('menu-open')));setMobileMenu(false);init().catch(e=>{console.error(e);toast('IndexedDB konnte nicht geöffnet werden')});
